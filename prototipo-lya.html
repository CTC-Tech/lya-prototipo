<title>Lya Protótipo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Paleta do logo da Lya: marinho #004694 (nome) para ação, turquesa #00A3B4 (símbolo) para o que está ao vivo, lilás #6F5FD0 de apoio no que a Lya sugere (chat, hipóteses, sugestões), verde só para sucesso. Layout: app shell com menu lateral fixo por papel, barra superior com "Ver como" e área de conteúdo fluida. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EBEFF5; --ink:#1B2839; --muted:#5A6884; --line:#DCE2EB;
  --navy:#003A78; --navy-tint:#E6F3F7; --btn:#004694; --on-btn:#FFFFFF;
  --teal:#00A3B4; --teal-ink:#007A87; --teal-tint:#E0F5F5;
  --danger:#B8302A; --danger-tint:#FCE6E4; --warn:#9A5B00; --warn-tint:#FDF0D9; --ok:#087A5D; --ok-tint:#DCF4EB;
  --hl:rgba(0,163,180,.14); --hero:#EEF7FA; --purple:#6F5FD0; --purple-tint:#F1EEFC; --lilac:#6F5FD0; --lilac-tint:#F1EEFC; --lilac-mid:#A99DF0; --on-hero:#1B2839; --live-btn:#004694; --on-live:#FFFFFF; --scrim:rgba(13,27,42,.4);
  --shadow:0 1px 2px rgba(12,26,44,.06),0 8px 24px rgba(0,70,148,.07);
  --f-sans:"Geist",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1018; --surface:#111A27; --surface-2:#172231; --ink:#E7ECF4; --muted:#9AA8BC; --line:#263346;
  --navy:#9ED4F2; --navy-tint:#0F2A3E; --btn:#5BB8EA; --on-btn:#03182A;
  --teal:#3FD3D4; --teal-ink:#74E2E2; --teal-tint:#0B2E33;
  --danger:#FF8A80; --danger-tint:#3A1715; --warn:#F5B54A; --warn-tint:#33250D; --ok:#4BD9B2; --ok-tint:#0E2E26;
  --hl:rgba(63,211,212,.18); --hero:#0D1E2B; --purple:#BDB3FA; --purple-tint:#221E3D; --lilac:#BDB3FA; --lilac-tint:#221E3D; --lilac-mid:#8C7FE6; --on-hero:#E7ECF4; --live-btn:#5BB8EA; --on-live:#03182A; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1018; --surface:#111A27; --surface-2:#172231; --ink:#E7ECF4; --muted:#9AA8BC; --line:#263346;
  --navy:#9ED4F2; --navy-tint:#0F2A3E; --btn:#5BB8EA; --on-btn:#03182A;
  --teal:#3FD3D4; --teal-ink:#74E2E2; --teal-tint:#0B2E33;
  --danger:#FF8A80; --danger-tint:#3A1715; --warn:#F5B54A; --warn-tint:#33250D; --ok:#4BD9B2; --ok-tint:#0E2E26;
  --hl:rgba(63,211,212,.18); --hero:#0D1E2B; --purple:#BDB3FA; --purple-tint:#221E3D; --lilac:#BDB3FA; --lilac-tint:#221E3D; --lilac-mid:#8C7FE6; --on-hero:#E7ECF4; --live-btn:#5BB8EA; --on-live:#03182A; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
a{color:var(--navy)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}

/* shell */
.shell{display:grid;grid-template-columns:var(--sbw,68px) minmax(0,1fr);min-height:100%;transition:grid-template-columns .18s ease}
body.nav-open .shell{--sbw:256px}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:transparent transparent;display:flex;flex-direction:column;gap:1px;padding:12px 10px 12px max(10px,env(safe-area-inset-left,0px))}
.side:hover{scrollbar-color:var(--line) transparent}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:transparent;border-radius:6px}.side:hover::-webkit-scrollbar-thumb{background:var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;height:40px;padding:0 11px;margin-bottom:6px;white-space:nowrap}
.nw{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;margin-bottom:8px;border-radius:10px;background:var(--btn);color:var(--on-btn);font-weight:500;font-size:13.5px;text-decoration:none;white-space:nowrap;flex:none}
.nw:hover{filter:brightness(1.08)}
.side .nl{white-space:nowrap}
body:not(.nav-open):not(.nav-peek) .side .nl,body:not(.nav-open):not(.nav-peek) .brand .org,body:not(.nav-open):not(.nav-peek) .side-foot .txt{display:none}
body:not(.nav-open):not(.nav-peek) .nav-sec{height:1px;padding:0;margin:10px 8px;background:var(--line);font-size:0}
body:not(.nav-open):not(.nav-peek) .nav a{justify-content:center;padding:0}
body:not(.nav-open):not(.nav-peek) .nav a .n{position:absolute;top:6px;right:8px;margin:0}
body:not(.nav-open):not(.nav-peek) .nav a .n .novo,body:not(.nav-open):not(.nav-peek) .nav a .n .cnt{width:8px;height:8px;padding:0;font-size:0;border-radius:50%;background:var(--teal-ink)}
body:not(.nav-open):not(.nav-peek) .nav a .n .cnt{background:var(--btn)}
.rail-toggle{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border:0;background:transparent;border-radius:9px;color:var(--muted);cursor:pointer;font-size:13px;white-space:nowrap}
.rail-toggle:hover{background:var(--surface-2);color:var(--ink)}
body:not(.nav-open):not(.nav-peek) .rail-toggle{justify-content:center;padding:0}
.mark{width:26px;height:26px;border-radius:7px;background:conic-gradient(from 45deg,var(--teal),var(--btn),var(--teal));position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.nav-sec{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px;white-space:nowrap}
.nav a{position:relative;display:flex;align-items:center;gap:11px;height:36px;padding:0 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:13.5px;cursor:pointer;transition:background .12s,color .12s}
.nav a svg{flex:none;color:var(--muted);transition:color .12s}
.nav a:hover{background:color-mix(in srgb,var(--surface-2) 65%,transparent)}
.nav a:hover svg{color:var(--ink)}
.nav a.on{background:var(--navy-tint);color:var(--navy);font-weight:500}
.nav a.on svg{color:var(--navy)}
.nav a.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--btn)}
.nav a .nl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav a .n{margin-left:auto}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.side-foot b{color:var(--ink);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px 20px}
.top .crumb{font-size:13px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb b{color:var(--ink);font-weight:600}
.viewas{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px}
.viewas select{border:0;background:var(--surface);border-radius:999px;padding:5px 10px;font:600 12.5px var(--f-sans);color:var(--navy);cursor:pointer}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--ink)}
.menu-btn{display:none}
.content{padding:24px max(16px,env(safe-area-inset-right,0px)) 40px 24px;max-width:1440px;width:100%}
@media (max-width:980px){
  .shell,body.nav-open .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  body:not(.nav-open):not(.nav-peek) .side .nl,body:not(.nav-open):not(.nav-peek) .brand .org{display:inline}
  body:not(.nav-open):not(.nav-peek) .nav-sec{height:auto;padding:14px 10px 6px;margin:0;background:none;font-size:10.5px}
  body:not(.nav-open):not(.nav-peek) .nav a{justify-content:flex-start;padding:0 13px}
  .rail-toggle{display:none}
  .side.open{transform:none}
  .menu-btn{display:grid}
  .content{padding:18px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px))}
}

/* page header */
.ph{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph .t{flex:1;min-width:240px;display:grid;gap:4px}
.ph h1{font-size:24px;font-weight:600}
.ph p{color:var(--muted);max-width:70ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* atoms */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1px solid transparent;font:500 13px/1 var(--f-sans);letter-spacing:.005em;transition:background .15s,box-shadow .15s,border-color .15s;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.p{background:var(--btn);color:var(--on-btn);box-shadow:0 1px 2px rgba(0,70,148,.18)}
.btn.p:hover:not(:disabled){box-shadow:0 4px 14px rgba(0,70,148,.30)}
.btn.g:hover:not(:disabled){border-color:var(--muted)}
.btn.g{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.q{background:transparent;color:var(--navy)}
.btn.d{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn[disabled],.btn.locked{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip.navy{background:var(--navy-tint);color:var(--navy)}
.chip.teal{background:var(--teal-tint);color:var(--teal-ink)}
.chip.red{background:var(--danger-tint);color:var(--danger)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.chip.ok{background:var(--ok-tint);color:var(--ok)}
.chip.line{background:transparent;border-color:var(--line)}
.chip.mono{font-family:var(--f-mono);font-size:10.5px}
.novo{display:inline-flex;font:600 9.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--teal-tint);color:var(--teal-ink);vertical-align:middle;white-space:nowrap}
body.hide-novo .novo{display:none}
.sens{display:inline-flex;align-items:center;gap:3px;font:600 9.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--warn-tint);color:var(--warn);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{font-size:15px;font-weight:600}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .d{font-size:12px;margin-top:4px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:16px}
.banner.warn{border-color:var(--warn);background:var(--warn-tint);color:var(--warn)}
.banner.info{background:var(--navy-tint);border-color:transparent;color:var(--navy)}
.banner .sp{flex:1;min-width:200px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-sans);background:var(--navy-tint);color:var(--navy);flex:none}
.avatars{display:flex}
.avatars .avatar{width:26px;height:26px;border:2px solid var(--surface);margin-left:-6px;font-size:10px}
.avatars .avatar:first-child{margin-left:0}

/* forms */
.field{display:grid;gap:6px;align-content:start}
.field label,.lbl{font-size:12px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface);font:13.5px var(--f-sans);color:var(--ink)}
textarea.input{min-height:96px;resize:vertical;line-height:1.55}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);color:var(--muted);min-width:0}
.search input{border:0;background:transparent;padding:9px 0;font:13.5px var(--f-sans);color:var(--ink);width:100%;min-width:0}
.search input:focus{outline:none}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .search{flex:1;min-width:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy-tint);color:var(--navy);font-weight:600}
.sw{position:relative;width:36px;height:20px;border-radius:999px;border:0;background:var(--line);cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--btn)}
.sw[aria-checked="true"]::after{left:18px}
.sw[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.cnt{font:500 11px var(--f-mono);background:var(--surface-2);color:var(--muted);padding:1px 6px;border-radius:999px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
.t th,.t td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t thead th{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);white-space:nowrap}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:600;display:block}
.who small{color:var(--muted);font-size:12px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;font-size:12.5px;color:var(--muted)}

/* lock */
.lock{display:grid;gap:8px;justify-items:start;padding:16px;border:1px dashed var(--line);border-radius:10px;background:var(--surface-2);color:var(--muted);font-size:13px}
.lock b{color:var(--ink)}
.lock .row{display:flex;gap:8px;align-items:center}
.noacc{max-width:560px;margin:48px auto;text-align:left}

/* live consult */
.consult{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1.1fr);gap:14px}
@media (max-width:1200px){.consult{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.consult .c3{grid-column:1/-1}}
@media (max-width:760px){.consult{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:14px;align-content:start;min-width:0}
.cbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.cbar .pt{display:flex;gap:10px;align-items:center;flex:1;min-width:220px}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--f-mono);padding:5px 9px;border-radius:999px;background:var(--teal-tint);color:var(--teal-ink);white-space:nowrap}
.pill.red{background:var(--danger-tint);color:var(--danger)}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--hl)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.timer{font:500 15px var(--f-mono)}
.ln{display:grid;grid-template-columns:42px minmax(0,1fr);gap:8px;font-size:12.5px;line-height:1.5}
.ln .tm{font:11px var(--f-mono);color:var(--muted);padding-top:2px}
.ln .wh{font-weight:600;font-size:11.5px;color:var(--muted);margin-right:4px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.tr{display:grid;gap:9px;max-height:300px;overflow:auto}
.sa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;transition:box-shadow .3s;min-width:0}
.sa.flash{box-shadow:0 0 0 2px var(--teal)}
.sa.crit{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-tint)}
.sa-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sa-h b{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.ts{font:10.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.ev{font:10.5px var(--f-mono);color:var(--teal-ink);text-decoration:underline dotted;text-underline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.sagrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.sagrid{grid-template-columns:minmax(0,1fr)}}
.hyp{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:6px 10px;align-items:center;font-size:12.5px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:3px}
.qs{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:12.5px}
.qs li{display:flex;gap:8px;align-items:flex-start}
.qs .c{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);margin-top:3px;flex:none}
.qs .c.ok{background:var(--teal-ink);border-color:var(--teal-ink)}
.qs .dn{color:var(--muted);text-decoration:line-through}
.flag{font:10.5px var(--f-mono);padding:1px 6px;border-radius:4px;white-space:nowrap}
.flag.lo{background:var(--warn-tint);color:var(--warn)}
.flag.hi{background:var(--danger-tint);color:var(--danger)}
.flag.nm{background:var(--surface-2);color:var(--muted)}
.msg{padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5}
.msg.me{background:var(--navy-tint);justify-self:end;max-width:90%}
.msg.ai{border:1px solid var(--line);background:var(--surface)}
.cite{font:10.5px var(--f-mono);padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.composer{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px;background:var(--surface)}
.composer input{flex:1;border:0;background:transparent;font:13px var(--f-sans);color:var(--ink);min-width:0;padding:6px 0}
.composer input:focus{outline:none}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;display:grid;gap:4px;justify-items:center;color:var(--muted);font-size:12.5px}
.drop b{color:var(--ink)}
.labt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 10px;font-size:12.5px;align-items:center}

/* fluxo do atendimento e padrões vindos da referência */
.phase{list-style:none;margin:0 0 16px;padding:0;display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.phase li{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.phase li.cur{border-color:var(--navy);color:var(--navy);font-weight:600;background:var(--navy-tint)}
.phase li.done{color:var(--ok)}
.phase .pn{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font:600 10px var(--f-mono)}
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-tint)}
.ag{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.ag:last-child{border-bottom:0}
.ag:hover{background:var(--surface-2)}
.wavebar{display:flex;gap:3px;align-items:center;height:22px}
.wavebar i{width:3px;border-radius:2px;background:var(--teal-ink)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer}
.consent input{margin-top:3px;width:16px;height:16px;flex:none}
.chatpage{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:800px){.chatpage{grid-template-columns:minmax(0,1fr)}}
.chat-list{display:grid;gap:4px;align-content:start;padding:12px}
.chat-it{display:grid;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;gap:2px}
.chat-it b{font-size:13px;font-weight:500}
.chat-it small{font-size:12px;color:var(--muted)}
.chat-it.on,.chat-it:hover{background:var(--navy-tint)}
.ins{display:flex;gap:10px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.ins b{font-size:13px}
.ins-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--navy-tint);color:var(--navy)}
.ins.w .ins-ic{background:var(--warn-tint);color:var(--warn)}
.ins.c{border-color:var(--danger)}
.ins.c .ins-ic{background:var(--danger-tint);color:var(--danger)}

/* logos */
.brand{text-decoration:none;color:inherit}
.logo-sym{width:36px;height:36px;max-width:none;object-fit:contain;flex:none}
.logo-full{height:24px;width:auto;max-width:none;display:none}
body:not(.nav-open):not(.nav-peek) .brand{justify-content:center;padding:0}
:is(body.nav-open,body.nav-peek) .logo-sym{display:none}
:is(body.nav-open,body.nav-peek) .logo-full.lt{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) :is(body.nav-open,body.nav-peek) .logo-full.lt{display:none}:root:not([data-theme="light"]) :is(body.nav-open,body.nav-peek) .logo-full.dk{display:block}}
:root[data-theme="dark"] :is(body.nav-open,body.nav-peek) .logo-full.lt{display:none}
:root[data-theme="dark"] :is(body.nav-open,body.nav-peek) .logo-full.dk{display:block}

/* início e preparar (padrão da referência) */
.pghead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.pghead h1{font-size:24px;font-weight:600;margin-top:2px}
.home{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.home{grid-template-columns:minmax(0,1fr)}}
.home.one,.pghead.one{grid-template-columns:minmax(0,1fr);max-width:860px;margin-left:auto;margin-right:auto}
.hero-next{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,var(--hero),var(--surface) 75%);color:var(--on-hero);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.hero-next .op{color:var(--muted)}
.hn-tx{flex:1;min-width:220px;display:grid;gap:3px}
.hn{font-size:22px;font-weight:600;letter-spacing:-.02em}
.avatar.xl{width:48px;height:48px;font-size:14px;background:var(--surface);color:var(--navy);border:1px solid var(--line)}
/* um só estilo de botão principal: .live mantém o nome, mas usa a mesma cor de .p */
.btn.live{background:var(--btn);color:var(--on-btn);box-shadow:0 1px 2px rgba(0,70,148,.18)}
.btn.live:hover:not(:disabled){box-shadow:0 4px 14px rgba(0,70,148,.30)}
.btn.lg{height:46px;padding:0 22px;font-size:14px;border-radius:10px}
.ag.cur{background:var(--navy-tint);border-bottom-color:transparent}
.ag.cur b,.ag.cur .tm2{color:var(--navy)}
.ag.cur .small{color:var(--navy)}
.tm2{font-size:14px;color:var(--muted);min-width:52px;flex:none;white-space:nowrap}
.chip.bgw{background:var(--surface)}
.ask{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--navy);background:var(--surface)}
.ask input{border:0;background:transparent;font:13.5px var(--f-sans);color:var(--ink);flex:1;min-width:0}
.ask input:focus{outline:none}
.crumbbar{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:20px}
.crumbbar a{display:flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none}
.prep{max-width:760px;margin:0 auto;padding:22px 28px;border-radius:18px;display:grid;gap:0}
.prep > div:first-child{padding-bottom:12px;border-bottom:1px solid var(--line)}
.prow2{display:grid;grid-template-columns:130px minmax(0,1fr);gap:16px;padding:11px 0;align-items:center;border-bottom:1px solid var(--line)}
@media (max-width:640px){.prow2{grid-template-columns:minmax(0,1fr);gap:8px}.prep{padding:20px 18px}}
.pl{font-size:13px;font-weight:600;color:var(--muted)}
.pv{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.pv.col1{display:grid;gap:8px}
.pv .who small{display:block}
.opts2{display:contents}
.optb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:13.5px;cursor:pointer;color:var(--ink)}
.optb.on{border-color:var(--btn);background:var(--navy-tint);color:var(--navy)}
.ctx{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.ctx svg{color:var(--teal-ink)}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:16px}
.sig i{width:3px;background:var(--teal);border-radius:1px}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:11px}.sig i:nth-child(4){height:14px}.sig i:nth-child(5){height:16px}
.sig i.off{background:var(--line)}
.sig.ok i:not(.off){background:var(--ok)}
.pfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:14px}

/* atendimento na mesma tela */
.consult2{display:grid;gap:12px}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.chead .sp{flex:1}
.pt2{display:flex;align-items:center;gap:10px}
.pt2 small{display:block;color:var(--muted);font-size:12px}
.chev-d{transform:rotate(90deg);width:12px;height:12px;vertical-align:middle;color:var(--muted)}
.dev{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.wave{display:inline-flex;gap:2px;align-items:center;height:18px}
.wave i{width:3px;border-radius:2px;background:var(--teal);animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}.wave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}
.simbox{display:inline-flex;align-items:center;gap:4px;border:1px dashed var(--line);border-radius:10px;padding:3px 6px}
.simbox button{border:0;background:transparent;border-radius:6px;padding:4px 8px;font:600 12px var(--f-mono);cursor:pointer;color:var(--muted)}
.simbox button.on{background:var(--navy-tint);color:var(--navy)}
.pill.navy{background:var(--navy-tint);color:var(--navy)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.ctabs{display:flex;gap:4px;align-items:center;overflow-x:auto;padding:2px}
.ctabs button{border:0;background:transparent;padding:9px 14px;border-radius:10px 10px 0 0;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.ctabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--btn)}
.ctabs .crt{background:var(--btn);color:var(--on-btn);border-radius:10px;padding:7px 12px;margin-left:4px;font-weight:500}
.ldot{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block;animation:pulse 1.6s infinite}
.ldot.b{background:var(--btn);animation:none}.ldot.a{background:var(--warn);animation:none}
.cbody{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.cbody.nopanel{grid-template-columns:minmax(0,1fr)}
@media (max-width:1000px){.cbody{grid-template-columns:minmax(0,1fr)}}
.cmain{padding:0;overflow:hidden;min-height:420px}
.cmain > *:not(.nbar):not(.note){margin:16px}
.nbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.nbar .sp{flex:1}
.nst{display:inline-flex;gap:8px;align-items:center}
.note{padding:18px 22px;display:grid;gap:18px}
.ns{display:grid;grid-template-columns:16px minmax(0,1fr);gap:12px}
.ns h4{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.ns p{font-size:15px;line-height:1.65}
.nd{width:11px;height:11px;border-radius:50%;margin-top:4px;background:var(--teal)}
.ns.writing .nd{background:var(--surface);border:2.5px solid var(--btn);box-shadow:0 0 0 3px var(--navy-tint)}
.ns.todo .nd{background:transparent;border:1.5px dashed var(--line)}
.ns.warn .nd{background:var(--warn)}
.ns.todo h4{color:var(--line)}
.skel{display:block;height:10px;width:min(480px,80%);border-radius:5px;background:var(--surface-2)}
.fresh{background:var(--hl);border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.pend{background:var(--warn-tint);color:var(--warn);border-radius:4px;padding:1px 4px}
.alg{color:var(--danger);font-weight:600}
.cside{display:grid;gap:12px;position:sticky;top:76px}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.side-card.rev{border-color:var(--warn)}
.side-card h3{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.badge{min-width:20px;height:20px;border-radius:999px;background:var(--btn);color:var(--on-btn);font:600 11px var(--f-mono);display:inline-grid;place-items:center;padding:0 6px}
.badge.a{background:var(--warn);color:var(--surface)}
.lc{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;font-size:12.5px;background:var(--surface)}
.lc b{font-size:13.5px;color:var(--navy)}
.lc span{color:var(--muted);line-height:1.45}
.lc.c{background:var(--danger-tint);border-color:var(--danger)}
.lc.c b{color:var(--danger)}
.lc.w{background:var(--warn-tint);border-color:transparent}
.lc.w b{color:var(--warn)}
.lc.ok{background:var(--ok-tint);border-color:transparent}
.lc.ok b{color:var(--ok)}
.lc .src2{font-size:10.5px;color:var(--teal-ink)}
.lc-a{display:flex;gap:12px;margin-top:4px;flex-wrap:wrap}
.lc-a button{border:0;background:transparent;padding:0;font:500 12.5px var(--f-sans);color:var(--navy);cursor:pointer}
.lc-a button:last-child:not(.solid){color:var(--muted)}
.lc-a .solid{border:1px solid var(--navy);border-radius:8px;padding:6px 10px;background:var(--surface)}
.gen{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:13px}
.gen li{display:flex;gap:9px;align-items:flex-start;color:var(--muted)}
.gen li.ok{color:var(--ink)}.gen li.ok svg{color:var(--teal-ink)}
.gen li.now{color:var(--ink);font-weight:500}
.gen li.now .spin{color:var(--btn);margin-top:3px}
.dotp{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:3px}
.doc{display:grid;gap:10px;max-width:68ch}
.doc h3{font-size:16px}
.doc ol{margin:0;padding-left:20px;display:grid;gap:4px}

/* ficha do paciente no cabeçalho do atendimento */
.ptwrap{position:relative}
.ptbtn{border:0;background:transparent;border-radius:10px;padding:4px 8px 4px 4px;cursor:pointer}
.ptbtn:hover,.ptbtn[aria-expanded="true"]{background:var(--surface-2)}
.ppop{position:absolute;top:calc(100% + 8px);left:0;z-index:25;width:min(420px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px}
.pp-h{display:flex;justify-content:space-between;align-items:center}
.pp-r{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.pp-l{color:var(--muted);font-size:12.5px}
.pp-v{font-weight:500}
.input.sm{padding:6px 9px;font-size:12.5px}
/* plano B2C */
.plan-mini{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:12.5px;color:var(--ink)}
.rail-up{display:none;width:40px;height:36px;margin:0 auto 6px;border:0;border-radius:9px;background:var(--warn-tint);color:var(--warn);cursor:pointer;place-items:center}
body:not(.nav-open):not(.nav-peek) .rail-up{display:grid}
@media (max-width:980px){body:not(.nav-open):not(.nav-peek) .rail-up{display:none}body:not(.nav-open):not(.nav-peek) .plan-mini{display:grid}}
.plans{align-items:stretch}
.plan{display:grid;gap:10px;align-content:start}
.plan.rec{border-color:var(--btn);box-shadow:0 0 0 3px var(--navy-tint)}
.plan h3{font-size:18px}
.plan .price{font-size:28px;font-weight:600;letter-spacing:-.02em}
.plan .price small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.plan ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.plan li{display:flex;gap:8px;align-items:center}
.plan li svg{color:var(--teal-ink)}
.plan .btn{justify-content:center;margin-top:auto}

/* dados clínicos vindos da integração */
.dc-note{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.dcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.dcgrid{grid-template-columns:minmax(0,1fr)}}
.dc{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}
.dc header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dc header h3{font-size:15px;font-weight:600;flex:1}
.dc header .ico{border-radius:50%}
.dc-src{position:absolute;top:-11px;right:14px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--navy-tint);color:var(--navy);border:1px solid var(--line)}
.dc-b{padding:14px 18px;display:grid;gap:6px;max-height:340px;overflow:auto}
.dc-b h4{font-size:12.5px;font-weight:600;color:var(--navy);margin-top:6px}
.dc-b ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:13px}
.dc-b ul.cols{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}
.risk-tag{font:600 11px var(--f-mono);padding:2px 8px;border-radius:4px}
.risk-tag.green{background:var(--ok-tint);color:var(--ok)}
.grp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;background:var(--bg)}
.grp-h{display:flex;justify-content:space-between;align-items:center}
.pillg{font:600 11px var(--f-sans);letter-spacing:.06em;color:var(--muted);background:var(--surface-2);padding:3px 10px;border-radius:999px}
ul.dcl{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.dcr{display:grid;grid-template-columns:12px auto auto;gap:4px 8px;align-items:center}
.dcr .dct{grid-column:2/-1;font-size:13px;letter-spacing:.01em}
.dcr .dct:only-of-type{grid-column:2/-1}
.ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.ring.on{border-color:var(--btn)}
.ring.anest{border-color:var(--purple)}
.tg{font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--navy-tint);color:var(--navy);justify-self:start}
.tg.mute{background:var(--surface-2);color:var(--muted)}
.tg.anest{background:var(--purple-tint);color:var(--purple)}
.cod{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;justify-self:start}

/* transcrição com falantes, tempo e vocabulário médico */
.tr-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.tr-legend span{display:inline-flex;gap:6px;align-items:center}
.spk{width:10px;height:10px;border-radius:3px;display:inline-block}
.spk.m{background:var(--btn)}.spk.p{background:var(--teal)}
.tr2{display:grid;gap:2px}
/* transcrição sem falantes: só tempo e texto, trechos alternados em dois tons */
.ln2{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:baseline;padding:7px 10px;border-radius:8px;background:var(--surface)}
.tr2 .ln2:nth-child(even){background:var(--bg)}
.ln2 .tm{font:11px var(--f-mono);color:var(--muted)}
.who2{font-size:12px;font-weight:600;color:var(--navy)}
.ln2.p .who2{color:var(--teal-ink)}
.ln2 p{font-size:14px;line-height:1.55}
@media (max-width:600px){.ln2{grid-template-columns:46px minmax(0,1fr)}.ln2 p{grid-column:1/-1}}
.fixd{text-decoration:underline dotted var(--teal-ink);text-decoration-thickness:2px;text-underline-offset:3px;cursor:help}
.ns-empty{display:grid;gap:4px;padding-top:6px;border-top:1px dashed var(--line)}
.ns-empty .btn{justify-self:start;padding-left:0}
.pp-sec{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}
.abcde{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:600px){.abcde{grid-template-columns:repeat(2,minmax(0,1fr))}}
.abcde div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;gap:1px;background:var(--surface)}
.abcde div.hit{border-color:var(--danger);background:var(--danger-tint)}
.abcde b{font-size:15px}.abcde div.hit b{color:var(--danger)}
.abcde span{font-size:11.5px;font-weight:600}.abcde small{font-size:11px;color:var(--muted)}

/* cadastro com questionário */
.reg{gap:18px}
.wiz{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.wiz li{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.wiz li.cur{border-color:var(--btn);background:var(--navy-tint);color:var(--navy);font-weight:600}
.wiz li.done{color:var(--ok)}
.wiz .pn{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font:600 10.5px var(--f-mono)}
.qlist{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow b{font-size:13.5px;font-weight:500;display:block}
.qrow small{font-size:12px;color:var(--muted)}
.qrow.off b{color:var(--muted);text-decoration:line-through}
.qrow.fixed{background:var(--bg)}
.newrow td{background:var(--teal-tint)}
.phonewrap{display:flex;gap:28px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.phone{width:min(360px,100%);min-height:640px;border:10px solid var(--hero);border-radius:36px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.ph-top{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ph-top img{max-width:none}
.ph-prog{height:4px;background:var(--surface-2)}
.ph-prog i{display:block;height:100%;background:var(--btn);transition:width .2s}
.ph-body{padding:22px 18px;flex:1;align-content:start}
.ph-body .optb{width:100%;text-align:left}
.ph-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.phone-note{max-width:280px;display:grid;gap:6px;padding-top:40px}

.sq{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sq li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.sq b{font-size:13px;font-weight:500;display:block}
.sq small{font-size:11.5px;color:var(--muted)}
.qi{width:20px;height:20px;border-radius:6px;background:var(--navy-tint);color:var(--navy);display:grid;place-items:center;font:600 12px var(--f-mono)}
.qi.ok{background:var(--ok-tint);color:var(--ok)}
.lk{font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lk-sep{font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 2px 0;border-top:1px dashed var(--line);margin-top:2px}
.lc.r{background:var(--navy-tint);border-color:transparent}
.lc.r b{color:var(--navy)}

/* chat flutuante */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 14px;border:0;border-radius:999px;background:var(--btn);color:var(--on-btn);font:600 13.5px var(--f-sans);cursor:pointer;box-shadow:0 10px 28px rgba(0,70,148,.28)}
.fab:hover{filter:brightness(1.07)}
.fab.on{background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.fchat{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:45;width:min(400px,calc(100vw - 32px));max-height:min(620px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(12,26,44,.22);overflow:hidden;animation:fcin .16s ease-out}
@keyframes fcin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.fchat header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.fchat header small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-body{padding:14px;display:grid;gap:10px;overflow:auto;flex:1;min-height:160px;align-content:start}
.fc-sugg{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:0 14px 10px;scrollbar-width:thin}
.fc-sugg .lk{display:none}
.fc-sugg .chip{flex:none}
.fc-sugg .chip{cursor:pointer}

/* novidades, identidade e chat completo */
.news{display:grid;gap:10px;align-content:start}
.news-ill{width:100%;height:auto;max-height:120px;background:var(--bg);border-radius:10px;padding:8px}
.news-f{display:flex;align-items:center;gap:6px}
.news-f .sp{flex:1}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{width:16px;background:var(--btn)}
.iconbtn.sm{width:28px;height:28px}
.orglogo{width:34px;height:34px;flex:none;border-radius:9px}
.mono-logo{display:grid;place-items:center;background:var(--navy-tint);color:var(--navy);font:700 12px var(--f-sans)}
.org-id{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:8px}
.org-id small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.08em;color:var(--muted)}
.org-id b{font-size:13px;line-height:1.2;color:var(--ink)}
body:not(.nav-open):not(.nav-peek) .org-id{padding:4px;justify-content:center;border:0;background:none}
.logo-up{display:flex;gap:14px;align-items:center}
.logo-up .orglogo{width:64px;height:64px;border-radius:14px}
.doc-org{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.doc-org small{display:block;font-size:11.5px;color:var(--muted)}
.fc-src{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}
.fc-src .chip{cursor:pointer}
.fc-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fc-meta{display:flex;align-items:center;gap:4px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.fc-meta .sp{flex:1}
.dd{position:relative}
.dd-menu{position:absolute;bottom:calc(100% + 6px);left:0;z-index:5;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid}
.dd-menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--ink)}
.dd-menu button:hover{background:var(--surface-2)}

/* chat no estilo dos agentes de IA */
.chpanel{position:fixed;top:env(safe-area-inset-top,0px);right:0;bottom:0;z-index:46;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(12,26,44,.14);display:flex;flex-direction:column;animation:chin .18s ease-out;padding-right:env(safe-area-inset-right,0px)}
@keyframes chin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.chpanel header{display:flex;align-items:center;gap:6px;padding:12px 14px 10px 18px;border-bottom:1px solid var(--line)}
.chpanel header b{font-size:15px;display:block}
.chpanel header small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-body{flex:1;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
.ch-empty{margin:auto 0 0;display:grid;gap:6px;justify-items:center;text-align:center;padding:6px 0 2px}
.ch-logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--teal-tint);color:var(--teal-ink)}
.ch-empty h2{font-size:17px;font-weight:600}
.ch-empty p{font-size:13px}
.ch-sug{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%;margin-top:10px}
.ch-sug button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font:500 13px var(--f-sans);color:var(--ink);cursor:pointer;min-width:0}
.ch-sug button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sug button svg{flex:none}
.ch-sug button:hover{background:var(--navy-tint);border-color:color-mix(in srgb,var(--btn) 35%,transparent)}
.ch-sug svg{color:var(--teal-ink)}
.ch-u{display:flex;justify-content:flex-end}
.ch-u p{background:var(--surface-2);border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:85%;font-size:14px;line-height:1.5}
.ch-a{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.ch-av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--teal-tint);color:var(--teal-ink)}
.ch-at p{font-size:14.5px;line-height:1.65}
.ch-src{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ch-tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap;margin-top:6px}
.ch-tools .sp{flex:1}
.ch-tools .iconbtn{border-color:transparent;background:transparent}
.ch-tools .iconbtn:hover{background:var(--surface-2)}
.ch-comp{margin:0 14px;border:1px solid var(--line);border-radius:22px;padding:10px 10px 8px 16px;background:var(--surface);box-shadow:0 4px 16px rgba(12,26,44,.06);display:grid;gap:6px}
.ch-comp textarea{border:0;background:transparent;resize:none;font:14.5px/1.5 var(--f-sans);color:var(--ink);min-height:24px;max-height:160px;padding:4px 0}
.ch-comp textarea:focus{outline:none}
.ch-comp:focus-within{border-color:var(--btn);box-shadow:0 0 0 3px var(--navy-tint)}
.ch-row{display:flex;align-items:center;gap:6px}
.ch-row .sp{flex:1}
.ch-ico{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ch-ico:hover{color:var(--ink);background:var(--surface-2)}
.ch-pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 12.5px var(--f-sans);color:var(--muted);cursor:pointer}
.ch-send{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer}
.ch-foot{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 14px 12px}
.dd-menu.up{bottom:calc(100% + 6px);top:auto}
.dd-menu button{display:flex;gap:8px;align-items:center}
.ck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);display:grid;place-items:center}
.ck.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chfull{display:flex;flex-direction:column;min-height:560px;padding:0}
.chfull .ch-body{padding:24px max(18px,calc((100% - 720px)/2))}
.chfull .ch-comp{margin:0 max(14px,calc((100% - 740px)/2))}
/* pausa, início vazio e protótipo */
.hero-acts{display:flex;gap:8px;flex-wrap:wrap}
.empty-st{display:grid;gap:6px;justify-items:center;text-align:center;padding:28px 12px;color:var(--muted)}
.empty-st svg{width:28px;height:28px}
.empty-st b{color:var(--ink);font-size:15px}
.empty-st.sm{padding:16px 8px}
.protobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px}
body.hide-novo .protobar{display:none}

/* Fale com a Lya no estilo ChatGPT */
.askbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--f-sans);cursor:pointer}
.askbtn svg{color:var(--teal)}
.askbtn:hover,.askbtn[aria-expanded="true"]{background:var(--teal-tint);border-color:transparent}
@media (max-width:700px){.askbtn span{display:none}}
.ch-comp.big{border-radius:26px;padding:16px 14px 10px 20px;box-shadow:0 6px 24px rgba(12,26,44,.08)}
.ch-comp.big textarea{font-size:16px;min-height:52px}
.ch-ico.bare{border:0;background:transparent;color:var(--ink)}
.ch-ico.bare svg{width:20px;height:20px}
.ch-mode{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:0;background:transparent;border-radius:999px;font:500 13.5px var(--f-sans);color:var(--ink);cursor:pointer}
.ch-mode:hover{background:var(--surface-2)}
.ch-send{background:var(--btn);color:var(--on-btn)}
.dd-menu.right{left:auto;right:0}
.dd-menu:not(.up){top:calc(100% + 6px);bottom:auto}
.hask{margin-bottom:18px}
.hask-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:0 16px;padding:8px 12px;background:var(--surface-2);border-radius:0 0 16px 16px}
.hask-row button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:7px 10px;border-radius:8px;font:13.5px var(--f-sans);color:var(--muted);cursor:pointer}
.hask-row button:hover{background:var(--surface);color:var(--ink)}
.hask-row .sp{flex:1}
.land{max-width:820px;margin:0 auto;padding:36px 20px 28px;display:grid;gap:0}
.land h1{font-size:28px;font-weight:500;text-align:center;margin-bottom:24px;letter-spacing:-.02em}
.land-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:30px 4px 12px}
.land-h svg{color:var(--teal)}
.land-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:800px){.land-cards{grid-template-columns:minmax(0,1fr)}}
.lcard{border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px;align-content:start;background:var(--surface)}
.lcard-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.lcard b{font-size:15px;font-weight:500}
.lcard span{font-size:13.5px;color:var(--muted);line-height:1.45}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font:500 13px var(--f-sans);color:var(--ink);cursor:pointer}
.pillbtn:hover{background:var(--surface-2)}
.chfull{min-height:620px}

/* rodapé da Home, passos do criador e captação */
.hask.dock{position:static;margin:0;padding:0;background:none;max-width:none}
.hask.dock .ch-comp.big{margin:0;padding:10px 10px 8px 18px;border-radius:22px;box-shadow:0 8px 28px rgba(12,26,44,.14),0 1px 3px rgba(12,26,44,.06)}
.hask.dock .ch-comp.big textarea{min-height:24px;height:28px;font-size:15px;overflow:hidden}
.hask.dock .hask-row{display:none}
.hask.dock:focus-within .hask-row{display:flex}
.sa-prog{display:grid;gap:6px;margin-bottom:14px;max-width:520px}
.steps a.cur{background:var(--navy-tint);color:var(--navy);font-weight:600}
.ex{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--teal-tint);color:var(--teal-ink);font-size:12.5px;line-height:1.45}
.ex svg{flex:none;margin-top:2px}
.step-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:760px){.howto{grid-template-columns:minmax(0,1fr)}}
.howto div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.howto .hn2{grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--teal-tint);color:var(--teal-ink);display:grid;place-items:center;font:600 13px var(--f-mono)}
.howto b{font-size:14px}.howto span:not(.hn2){font-size:12.5px;color:var(--muted)}
.cap-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cap-r{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l t" "v v";gap:2px 8px;align-items:baseline;padding:8px 10px;border-radius:8px;font-size:13px;min-width:0}
.cap-r .pp-l{grid-area:l;font-size:12px}
.cap-r .ts{grid-area:t}
.cap-r .pp-v{grid-area:v;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.cap-r.in{background:var(--teal-tint)}
.capc{border-color:var(--teal)}

/* encerrar atendimento */
.dlg{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:16px;padding:22px;box-shadow:0 20px 60px rgba(12,26,44,.25);display:grid;gap:12px}
.dlg h3{font-size:18px}
.enc-l{list-style:none;display:grid;gap:10px;margin:4px 0;padding:0}
.enc-l li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;font-size:13.5px;line-height:1.45}
.enc-l svg{color:var(--muted);margin-top:2px}
.dlg-a{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:6px}
.clog{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;font-size:12.5px}
.clog li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px}
.clog .mono{color:var(--muted)}
.clog-m{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:10px 0;border-top:1px solid var(--line);margin-bottom:10px}
.clog-m div{display:grid;gap:2px;min-width:0}.clog-m b{overflow-wrap:anywhere}

/* troca de paciente */
.ptpick{display:grid;gap:4px;border:1px solid var(--line);border-radius:12px;padding:10px}
.ptpick>.small{padding:6px 8px 2px}
.ptopt{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:8px;padding:8px;cursor:pointer;font:inherit;color:var(--ink)}
.ptopt small{display:block;color:var(--muted);font-size:12px}
.ptopt:hover{background:var(--surface-2)}
.ptopt[hidden]{display:none}
.ptopt.on{background:var(--navy-tint)}
.ptopt svg{color:var(--navy)}

/* dados clínicos: resumo + seções que abrem e fecham */
.dx-head{margin-bottom:10px}.dx-head svg{vertical-align:-2px}
.dxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.dxs>div{background:var(--surface);padding:10px 14px;display:grid;gap:3px;min-width:0}
.dxs-l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dxs-v{font-size:13.5px;overflow-wrap:anywhere}
.dang{color:var(--danger)}.warn-t{color:var(--warn)}
.dxlist{display:grid;gap:10px}
details.dx{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.dx>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-radius:12px}
details.dx>summary::-webkit-details-marker{display:none}
details.dx>summary:hover{background:var(--surface-2)}
details.dx>summary:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
details.dx .ico{width:30px;height:30px;border-radius:50%;flex:none}
.dx-t{display:grid;gap:1px;min-width:0;flex:1}.dx-t b{font-size:14.5px;font-weight:600}.dx-t small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.dx[open] .dx-t small{display:none}
.dx-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.dx-chev{color:var(--muted);transition:transform .15s}details.dx[open] .dx-chev{transform:rotate(90deg)}
@media (max-width:640px){.dx-meta{display:none}}
.dx-b{padding:2px 16px 16px 58px;display:grid;gap:12px}
@media (max-width:640px){.dx-b{padding-left:16px}}
.dx-b h4{font-size:12.5px;font-weight:600;color:var(--navy);margin-top:4px}
.dx-b ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:13px}
.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:7px 16px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}

// [item, cumprido em, obrigatório]. Para listas longas (15+): obrigatórios pendentes primeiro, até 5 pendentes à vista,
// "mais N pendentes" expande no próprio card, e só os 2 últimos concluídos aparecem
// [item, cumprido em, obrigatório]. Pendentes em cima; cumpridos descem riscados. Até 10 itens à vista; mais que isso rola dentro do card.
// [item, cumprido em]. Sem ordem obrigatória: o item é marcado quando aparece na fala, em qualquer sequência.

}

/* diferença palavra a palavra (LCS) */
function wdiff(a,b){const tk=x=>x.split(/(\s+|[.,;:()])/).filter(t=>t!==""),A=tk(a),B=tk(b),n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Int16Array(m+1));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 const out=[];let i=0,j=0;const push=(t,x)=>{const l=out[out.length-1];if(l&&l[0]===t)l[1]+=x;else out.push([t,x])};
 while(i<n&&j<m){if(A[i]===B[j]){push("=",A[i]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){push("-",A[i]);i++}else{push("+",B[j]);j++}}
 while(i<n)push("-",A[i++]);while(j<m)push("+",B[j++]);
 /* junta mudanças vizinhas (separadas só por espaço) num trecho único: removido, depois incluído */
 const res=[];let k=0;while(k<out.length){if(out[k][0]==="="){res.push(out[k]);k++;continue}let d="",ad="";
  while(k<out.length&&(out[k][0]!=="="||(!out[k][1].trim()&&k+1<out.length&&out[k+1][0]!=="="))){const [t,x]=out[k];if(t==="-")d+=x;else if(t==="+")ad+=x;else{d+=x;ad+=x}k++}
  if(d.trim())res.push(["-",d]);if(ad.trim())res.push(["+",ad]);if(res.length>1&&res[res.length-1][0]==="+"&&res[res.length-2][0]==="-")res.push(["="," "])}
 return res.filter((x,i,a)=>!(x[0]==="="&&x[1]===" "&&(i===a.length-1||a[i+1][0]==="=")))}
const vChanged=d=>d.secs.filter(x=>x[1]!==x[2]).length;
function vCount(d){let a=0,r=0;d.secs.forEach(x=>{if(x[1]!==x[2])wdiff(x[1],x[2]).forEach(p=>{if(p[0]==="+")a++;if(p[0]==="-")r++})});return [a,r]}

  <div class="howto"><div><span class="hn2">1</span><b>Escolha o objetivo</b><span>O que o card deve fazer no atendimento.</span></div><div><span class="hn2">2</span><b>Configure em 6 passos</b><span>Nome, momento, fontes, instrução, formato e quem usa.</span></div><div><span class="hn2">3</span><b>Teste e publique</b><span>Veja a prévia, teste em atendimentos anonimizados e publique.</span></div></div>
  <h3 style="font-size:15px;margin:4px 0 12px">1. Qual é o objetivo do Prompt?</h3>
  <div class="gal">${TEMPLATES.map(t=>{const dis=t.perm&&!can(t.perm);return `<button data-act="sa-tpl" data-val="${t.k}" ${dis?'disabled style="opacity:.55;cursor:not-allowed"':""}><span class="ico ${t.k==="ag"?"teal":""}">${ic(t.i)}</span><b>${t.t} ${dis?ic("lock","i s"):""}</b><span>${t.d}</span>${t.m?`<span class="chips"><span class="chip navy">${t.m}</span><span class="chip line">${t.f}</span></span>`:""}</button>`}).join("")}</div>`;

function saPreview(s){
  const card=(inner)=>`<div class="sa"><div class="sa-h"><b>${ic(s.icon,"i s")}${s.name||"Sem nome"}</b><span class="ts">${s.m==="Tempo real"?"agora":s.m==="Relatório"?"no fim":"sob demanda"}</span></div>${inner}</div>`;
  let inner="";
  if(s.f==="Indicadores")inner=`<div class="indic"><div><b>14,2%</b><small>risco em 10 anos</small></div><div><b class="mono" style="font-size:15px">148/92</b><small>PA · 09:14</small></div><div><b class="mono" style="font-size:15px">HDL</b><small>dado faltante</small></div></div><div class="chips"><span class="ev">09:14 transcrição</span><span class="ev">Lipidograma 02/08</span></div>`;
  else if(s.f==="Tags")inner=`<div class="chips"><span class="chip navy">Hipertensão</span><span class="chip navy">Tabagismo 20 maços-ano</span><span class="chip navy">Pai com IAM aos 52</span></div><span class="ev">08:41 · 09:02 transcrição</span>`;
  else if(s.f==="Checklist")inner=`<ul class="qs"><li><span class="c ok"></span><span class="dn">Dor torácica caracterizada</span></li><li><span class="c"></span><span>Tabagismo atual?</span></li><li><span class="c"></span><span>História familiar precoce?</span></li></ul>`;
  else if(s.f==="Tabela")inner=`<div class="labt"><span>Losartana</span><span class="mono">50 mg</span><span class="flag nm">1x/dia</span><span>AAS</span><span class="mono">100 mg</span><span class="flag nm">1x/dia</span></div>`;
  else if(s.f==="Gráfico")inner=`<svg class="chart" viewBox="0 0 280 70" width="100%" role="img" aria-label="PA sistólica nas últimos 4 atendimentos"><polyline points="10,50 90,38 170,30 260,18" fill="none" stroke="var(--navy)" stroke-width="2"/><circle cx="260" cy="18" r="3.5" fill="var(--navy)"/><text x="10" y="66">mai</text><text x="232" y="66">out</text><text x="214" y="14">148</text></svg>`;
  else inner=`<p class="small">Paciente de 58 anos, hipertenso e tabagista, com dor torácica aos esforços há 3 semanas. Nega síncope.</p>`;
  return card(inner);
}
V.smartapp=()=>{
  if(!S.sa)S.sa=newSA("ind");
  const s=S.sa, edit=can("sa_edit")||can("sa_criar");
  const done={1:!!s.name,2:!!s.m,3:Object.values(s.src).some(Boolean)||s.m==="Estático",4:s.m==="Estático"||s.instr.trim().length>20,5:!!s.f,6:Object.values(s.asst).some(Boolean)};
  const stepNames=["Identidade","Quando aparece","O que a Lya lê","O que extrair","Formato da resposta","Quem usa"];
  const momentos=[["Tempo real","Card que se atualiza durante o atendimento","bolt"],["Relatório","Gerado ao encerrar, entra no relatório","doc"],["Documento","Gerado quando o médico pede","file"],["Estático","Texto fixo, sem IA","list"]];
  const formatos=[["Texto","doc"],["Tags","tag"],["Checklist","list"],["Tabela","table"],["Gráfico","chart"],["Indicadores","gauge"]];
  const sources=[["Transcrição","O que foi dito no atendimento"],["Minhas anotações","O que o profissional digita"],["Dados do paciente","Idade, sexo, histórico e alergias"],["Integração","Dados do prontuário do hospital"],["Descrição cirúrgica","Detalhes do procedimento"],["Exames","Valores extraídos de PDFs e fotos"]];
  const EXS={1:"Exemplo: “Fatores de risco cardiovascular”, com a descrição “Lista os fatores citados no atendimento”.",2:"Exemplo: “Tempo real” para um card que acompanha a conversa; “Relatório” para uma seção que só aparece no fim.",3:"Exemplo: transcrição e dados do paciente. Ligue “Exames” se o card precisar de valores de laboratório.",4:"Exemplo: “Identifique fatores de risco cardiovascular relatados. Não deduza a partir de medicamentos.”",5:"Exemplo: Tags para itens curtos; Indicadores para números com origem; Tabela para medicações.",6:"Exemplo: agentes Cardiologia e Clínica Médica, grupo Cardiologia, e publique quando a prévia estiver certa."};
  const cur=S.saStep||1;
  const sec=(n,t,p,body)=>n!==cur?"":`<section class="sec-card" id="st-${n}"><div class="hd"><span class="num">${n}</span><div><h3>${t}</h3><p>${p}</p></div></div><div class="ex">${ic("spark","i s")}<span>${EXS[n]}</span></div>${body}
   <div class="step-nav">${n>1?`<button class="btn g" data-act="sa-step" data-val="${n-1}">${ic("chevl","i s")}Voltar</button>`:"<span></span>"}<span class="small muted">Passo ${n} de 6</span>${n<6?`<button class="btn p" data-act="sa-step" data-val="${n+1}">Próximo: ${stepNames[n]} ${ic("chev","i s")}</button>`:(can("sa_pub")?`<button class="btn live" data-act="sa-pub" ${Object.values(done).every(Boolean)?"":"disabled"}>Publicar para a equipe</button>`:`<button class="btn g" data-act="toast" data-msg="Rascunho salvo · v5">Salvar rascunho</button>`)}</div></section>`;
  return `<div class="ph"><div class="t"><h1 style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="ico">${ic(s.icon)}</span>${s.name||"Novo Prompt"} <span class="chip ${s.vis==="Publicado"?"ok":"warn"}">${s.vis}</span></h1><p>Seis passos curtos. A prévia à direita mostra o resultado num atendimento de exemplo a cada mudança, e você pode voltar a qualquer passo.</p></div>
   <div class="acts"><button class="btn g" data-go="smartapps">Voltar</button><button class="btn g" data-act="toast" data-msg="Rascunho salvo · v5">Salvar rascunho</button>${can("sa_pub")?`<button class="btn p" data-act="sa-pub" ${Object.values(done).every(Boolean)?"":"disabled"}>Publicar para a equipe</button>`:`<button class="btn p locked" disabled title="Requer Publicar Prompt">${ic("lock","i s")}Publicar</button>`}</div></div>
  ${edit?"":`<div class="banner warn">${ic("eye")}<span class="sp">Seu perfil só visualiza Prompts. Campos bloqueados.</span></div>`}
  <div class="sa-prog"><div class="small"><b>Passo ${cur} de 6</b> <span class="muted">· ${stepNames[cur-1]}</span></div><div class="meter"><i style="width:${cur/6*100}%"></i></div></div>
  <div class="sae">
   <nav class="steps" aria-label="Seções">${stepNames.map((x,i)=>`<a href="#smartapp" class="${i+1===cur?"cur":""}" data-act="sa-step" data-val="${i+1}"><span class="num ${done[i+1]?"ok":""}">${done[i+1]?"✓":i+1}</span>${x}</a>`).join("")}
    <div class="hint" style="padding:10px">Histórico de versões <span class="mono">v1–v4</span> · ${N()}</div></nav>
   <div class="grid" style="gap:14px">
    ${sec(1,"Identidade","Como o card aparece para a equipe na lista e no atendimento.",`<div class="grid g2"><div class="field"><label for="sa-name">Nome</label><input id="sa-name" class="input" data-sa="name" value="${s.name}" ${edit?"":"disabled"}><span class="hint">Use o termo clínico, não sigla interna.</span></div><div class="field"><label for="sa-desc">Para que serve</label><input id="sa-desc" class="input" data-sa="desc" value="${s.desc}" placeholder="Uma linha para a equipe saber quando usar" ${edit?"":"disabled"}></div></div>
      <div class="field"><span class="lbl">Ícone</span><div class="chips">${["gauge","heart","tag","list","table","doc","alert","steth","flask"].map(n=>`<button class="iconbtn" style="${s.icon===n?"border-color:var(--navy);color:var(--navy);background:var(--navy-tint)":""}" data-act="sa-set" data-k="icon" data-val="${n}" aria-label="Ícone ${n}">${ic(n)}</button>`).join("")}</div></div>`)}
    ${sec(2,"Quando aparece","Em que momento do atendimento a Lya gera este conteúdo.",`<div class="opts">${momentos.map(m=>`<button class="opt ${s.m===m[0]?"on":""}" data-act="sa-set" data-k="m" data-val="${m[0]}"><b>${ic(m[2],"i s")}${m[0]}</b><span>${m[1]}</span></button>`).join("")}</div>
      ${s.m==="Tempo real"?`<div class="grid g2" style="align-items:end"><div class="field"><span class="lbl">Atualizar o card</span>${can("sa_eint")?`<div class="seg">${["Automático","30 s","60 s","2 min"].map(x=>`<button class="${s.iv===x?"on":""}" data-act="sa-set" data-k="iv" data-val="${x}">${x}</button>`).join("")}</div>`:can("sa_vint")?`<span class="chip line">${s.iv} · só leitura</span>`:lockBox("sa_vint","Intervalo oculto")}<span class="hint">Automático deixa a Lya decidir. Intervalos curtos custam mais processamento.</span></div>
       <div class="src"><div class="tx"><b>Botão de atualizar no card</b><small>O médico pode pedir uma nova leitura</small></div>${sw(s.manual,"sa-tog",'data-k="manual"',!can("sa_erep"))}</div></div>`:""}`)}
    ${sec(3,"O que a Lya lê","Só as fontes ligadas aqui entram no processamento.",s.m==="Estático"?`<p class="muted small">Conteúdo fixo não lê nenhuma fonte.</p>`:`<div class="grid g2">${sources.map(([k,d])=>`<div class="src"><div class="tx"><b>${k} ${k==="Exames"?N():""}</b><small>${d}</small></div>${sw(s.src[k],"sa-src",`data-k="${k}"`,!edit)}</div>`).join("")}</div>
      ${s.agent?`<div class="grid" style="gap:8px"><span class="lbl">Ferramentas do agente</span>${[["up","Ler arquivos enviados","ag_up"],["web","Buscar na web","ag_web"],["fn","Chamar sistemas do hospital (function calling)","ag_fn"]].map(([k,l,p])=>`<div class="src"><div class="tx"><b>${l} <span class="sens">sensível</span></b><small>${can(p)?"Liberado para o seu perfil":"Requer “"+permLabel(p)+"”"}</small></div>${sw(s.tools[k],"sa-tool",`data-k="${k}"`,!can(p))}</div>`).join("")}</div>`:""}`)}
    ${sec(4,"O que extrair","Escreva só o pedido clínico. As regras de segurança da Lya são aplicadas automaticamente.",s.m==="Estático"?`<textarea class="input" aria-label="Texto fixo">Orientações de alta da instituição…</textarea>`:`<div class="field"><label for="sa-instr">Instrução clínica</label><textarea id="sa-instr" class="input" data-sa="instr" placeholder="Ex.: Identifique fatores de risco cardiovascular relatados. Não deduza a partir de medicamentos." ${edit?"":"disabled"}>${s.instr}</textarea><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="hint mono">${s.instr.length} / 2.000</span>${can("sa_melh")?`<button class="btn q sm" data-act="toast" data-msg="Instrução revisada: deixei a lista de dados explícita">${ic("edit","i s")}Melhorar instrução</button>`:""}</div></div>
      ${can("sa_prompt")?`<details class="base"><summary>${ic("shield","i s")}<b>Regras base da Lya · v3</b><span class="muted">aplicadas a todo Prompt de tempo real</span></summary><pre>Considere todo o contexto acumulado e retorne o estado completo a cada execução.
Quando uma informação for corrigida, prevalece a mais recente.
Use somente o que está explícito na transcrição, anotações ou fontes ligadas.
Nunca invente, suponha ou complete informação ausente.
Preserve valores, unidades, doses, via, lateralidade e temporalidade.
Não reproduza trechos literais da transcrição.</pre></details>`:lockBox("sa_prompt","Prompt completo oculto para este perfil")}`)}
    ${sec(5,"Formato da resposta","Defina os campos. A Lya monta o formato de saída a partir deles; não é preciso descrevê-lo na instrução.",`<div class="opts" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${formatos.map(([k,i])=>`<button class="opt ${s.f===k?"on":""}" data-act="sa-set" data-k="f" data-val="${k}"><b>${ic(i,"i s")}${k}</b>${k==="Indicadores"?N():""}</button>`).join("")}</div>
      <div class="fields"><div class="frow hint"><span>Campo</span><span>Tipo</span><span>Limite</span><span></span></div>${s.fields.map((r,ix)=>`<div class="frow"><input class="input" aria-label="Campo" value="${r[0]}"><select class="input" aria-label="Tipo"><option>${r[1]}</option><option>Texto curto</option><option>Lista de tags</option><option>Número</option></select><input class="input mono" aria-label="Limite" value="${r[2]}"><button class="iconbtn" data-act="sa-delf" data-val="${ix}" aria-label="Remover campo">${ic("x","i s")}</button></div>`).join("")}<button class="btn q sm" style="justify-self:start" data-act="sa-addf">${ic("plus","i s")}Adicionar campo</button></div>`)}
    ${sec(6,"Quem usa","Em quais agentes o card aparece e quais grupos podem vê-lo.",`<div class="grid g3">${Object.keys(s.asst).map(a=>`<div class="src"><div class="tx"><b>${a}</b><small>${a==="Pronto-socorro"?"Grupo Emergência":"Grupo "+(a==="Cardiologia"?"Cardiologia":"Padrão")}</small></div>${sw(s.asst[a],"sa-asst",`data-k="${a}"`,!edit)}</div>`).join("")}</div>
      <div class="grid g2"><div class="field"><span class="lbl">Grupos com acesso</span><div class="chips"><span class="chip navy">Cardiologia</span><span class="chip navy">Padrão</span><button class="chip line" style="cursor:pointer">${ic("plus","i s")}Grupo</button></div></div><div class="field"><span class="lbl">Visibilidade</span><div class="seg">${["Rascunho","Publicado","Oculto"].map(x=>`<button class="${s.vis===x?"on":""}" ${x==="Publicado"&&!can("sa_pub")?"disabled":""} data-act="sa-set" data-k="vis" data-val="${x}">${x}</button>`).join("")}</div></div></div>`)}
    ${can("sa_del")?`<div style="display:flex;justify-content:flex-end"><button class="btn d sm">${ic("trash","i s")}Excluir Prompt</button></div>`:""}
   </div>
   <aside class="prev" aria-label="Prévia">
    <div class="pv-card"><div class="card-h" style="margin:0"><h3>Prévia ao vivo</h3>${can("sa_prev")?`<span class="chip teal">${ic("play","i s")}rodou há 2 s</span>`:`<span class="chip">${ic("lock","i s")}sem preview</span>`}</div>
     <select class="input" aria-label="Atendimento de exemplo" data-sa="sample">${["Cardiologia · retorno","Pronto-socorro · dor torácica","Pediatria · febre"].map(x=>`<option ${x===s.sample?"selected":""}>${x}</option>`).join("")}</select>
     <div class="pv-frame">${can("sa_prev")?saPreview(s):lockBox("sa_prev","Preview indisponível")}</div>
     <div class="small muted mono">~1,2 s por execução · custo baixo</div></div>
    <div class="pv-card"><h3>Antes de publicar</h3><ul class="checklist">${stepNames.map((x,i)=>`<li><span class="${done[i+1]?"ok":"no"}">${ic(done[i+1]?"check":"clock","i s")}</span>${x}</li>`).join("")}</ul>
     <button class="btn g sm" data-act="toast" data-msg="Testado em 3 atendimentos anonimizados: 3 de 3 sem erro">Testar em 3 atendimentos anonimizados</button></div>
   </aside>
  </div>`;
};

V.assistente=()=>{
  const ed=can("as_edit")||can("as_criar");
  const lane=(t,items)=>`<div class="lane"><h4><span>${t}</span><span class="cnt">${items.length}</span></h4>${items.map(x=>`<div class="it">${ic("apps","i s")}<span>${x}</span>${ed?`<button class="iconbtn" style="width:26px;height:26px" aria-label="Mover">${ic("chev","i s")}</button>`:""}</div>`).join("")}${ed?`<button class="btn q sm" style="justify-self:start">${ic("plus","i s")}Adicionar</button>`:""}</div>`;
  return ph("Cardiologia","Agente de atendimento ambulatorial de cardiologia.",`<button class="btn g" data-go="assistentes">Voltar</button>${ed?`<button class="btn p" data-act="toast" data-msg="Agente salvo">Salvar</button>`:""}`)+`
  <div class="grid g3">
   <div class="grid" style="grid-column:span 2;gap:14px">
    <div class="card grid" style="gap:12px"><h3>Quem pode usar</h3><div class="chips"><span class="chip navy">Grupo Cardiologia · 18</span><span class="chip navy">Grupo Centro de excelência · 6</span>${ed?`<button class="chip line">${ic("plus","i s")}Grupo</button>`:""}</div><p class="hint">Só profissionais desses grupos veem este agente ao iniciar atendimento. O prompt do grupo é somado às instruções dos Prompts.</p></div>
    <div class="card grid" style="gap:10px"><h3>Recursos no atendimento</h3>${[["Atendimento anterior","Mostra o histórico do paciente durante a sessão",true],["Fluxo cirúrgico","Habilita descrição cirúrgica e OPME",false],["Fale com a Lya","Chat clínico na coluna direita",true,1],["Exames","Envio e leitura de exames",true,1]].map(r=>`<div class="src"><div class="tx"><b>${r[0]} ${r[3]?N():""}</b><small>${r[1]}</small></div>${sw(r[2],"tog","",!ed)}</div>`).join("")}</div>
    <div class="card"><div class="card-h"><h3>Estrutura do atendimento</h3><span class="hint">Ordem dos cards em cada momento</span></div><div class="grid g3">${lane("Durante o atendimento",["Alergias","Fatores de risco CV","Hipóteses diagnósticas","Sugestões de perguntas"])}${lane("No relatório",["Relatório clínico","Conduta estratificada","Exames complementares"])}${lane("Documentos",["Atestado","Encaminhamento"])}</div></div>
   </div>
   <div class="card grid" style="gap:10px;align-content:start"><h3>Como fica a tela</h3><div class="mini"><div>Transcrição<br>Paciente<br>Notas</div><div>Alergias · Fatores CV<br>Hipóteses<br>Perguntas</div><div>Fale com a Lya<br>Exames</div></div><p class="hint">Prévia do layout do atendimento com os cards desta estrutura.</p></div>
  </div>`;
};

V.usuarios=()=>ph("Usuários","248 profissionais · 231 ativos · 2FA ativo em 71%.",`${can("us_criar")?`<button class="btn g">${ic("upload","i s")}Importar planilha</button><button class="btn p">${ic("plus","i s")}Convidar usuário</button>`:""}`)+`
  <div class="banner warn">${ic("alert")}<span class="sp"><b>1 usuário sem perfil</b> não consegue operar a Lya, e <b>3 sem grupo</b> não veem nenhum agente.</span><button class="btn g sm">Revisar agora</button></div>
