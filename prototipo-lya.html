/* Calculadoras clínicas (do wireframe v7): IMC e BSA prontas com peso e altura do cadastro;
   as de escore ficam com dados parciais ou aguardando até a fala trazer o que falta. O resultado entra no relatório. */
const numBR=x=>parseFloat(String(x).replace(",",".").replace(/[^0-9.]/g,""));
const fmt=(n,d)=>n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const ptWH=()=>({w:numBR(PT.peso),h:Math.round(numBR(PT.alt)*(numBR(PT.alt)<3?100:1))});
function calcDefs(){
  const L={
   imc:{n:"IMC",live:1,f:[["w","Peso (kg)"],["h","Altura (cm)"]],run:v=>{const x=v.w/Math.pow(v.h/100,2);return [fmt(x,1),"kg/m²",x<18.5?"Abaixo do peso":x<25?"Peso adequado":x<30?"Sobrepeso":"Obesidade",`IMC: ${fmt(x,1)} kg/m² (peso ${fmt(v.w,1)} kg, altura ${v.h} cm)`]}},
   bsa:{n:"Superfície corporal (BSA)",live:1,f:[["w","Peso (kg)"],["h","Altura (cm)"]],run:v=>{const x=Math.sqrt(v.h*v.w/3600);return [fmt(x,2),"m²","Fórmula de Mosteller.",`Superfície corporal (Mosteller): ${fmt(x,2)} m²`]}}};
  const ass=PT.asst,act=CALC_CAT.filter(c=>{const g=calcCfg(c.id);return g.on&&(g.all||g.ass.includes(ass))});
  if(!act.some(c=>c.id==="bmi"))delete L.imc;if(!act.some(c=>c.id==="bsa"))delete L.bsa;
  const SRC_H={cad:"Vem do cadastro do paciente",dc:"Vem dos Dados Clínicos (integração)",fala:"Preenchido quando for dito no atendimento",dig:"Digitado pelo médico"};
  act.filter(c=>c.id!=="bmi"&&c.id!=="bsa").forEach(c=>{const g=calcCfg(c.id),src=c.in.map((x,i)=>g.src[i]||calcSrcGuess(x[0]));
   L[c.id]={n:c.t,cat:1,st:src.some(x=>x==="cad"||x==="dc")?"part":"wait",f:[...c.in.map((x,i)=>[x[0]+(x[1]?" ("+x[1]+")":""),SRC_H[src[i]]]),...c.cr.slice(0,6).map(x=>[x[0]+(x[1]!=null?` (+${x[1]})`:""),"Marcado quando aparecer no atendimento"])]}});
  if(CS===CASES.derm){L.scorad={n:"SCORAD",st:"part",f:[["Extensão das lesões (%)","Ainda não identificado no atendimento"],["Intensidade das lesões","Ainda não identificado no atendimento"],["Prurido e perda de sono (0–10)","Prurido citado no questionário: informe a nota"]]};
   L.pasi={n:"PASI",st:"wait",f:[["Área acometida por região","Ainda não identificado no atendimento"],["Eritema","Ainda não identificado no atendimento"],["Infiltração","Ainda não identificado no atendimento"],["Descamação","Ainda não identificado no atendimento"]]}}
  else{L.tw={n:"Truelove e Witts",st:"part",f:[["Evacuações com sangue por dia","6 a 7 · dito em 00:08"],["Temperatura","36,5 °C · dito em 00:42"],["Frequência cardíaca","92 bpm · dito em 00:42"],["Hemoglobina","10,9 g/dL · laboratório 12/10"],["VHS","Ainda não disponível"]]};
   L.mayo={n:"Escore de Mayo (parcial)",st:"wait",f:[["Frequência evacuatória","Ainda não confirmado"],["Sangramento retal","Ainda não confirmado"],["Avaliação global do médico","Aguardando a avaliação"]]}}
  return L;
}
document.addEventListener("input",e=>{
  if(e.target.id==="c-notes"){S.c.notes=e.target.value;return}
  if(e.target.id==="cfg-q"){S.cfgQ=e.target.value;const l=document.getElementById("cfg-list");if(l)l.innerHTML=calcCfgList(S.cfgQ.toLowerCase(),S.cfgSec||"",S.cfgSt||"todas");return}
  if(e.target.id==="calc-q"){S.c.calcQ=e.target.value;document.querySelectorAll(".calc-l").forEach(l=>{const tmp=document.createElement("div");tmp.innerHTML=calcList();l.replaceWith(tmp.querySelector(".calc-l"))});return}
  if(e.target.dataset.cf){const wh=ptWH();S.calcV=S.calcV||{w:wh.w,h:wh.h};S.calcV[e.target.dataset.cf]=numBR(e.target.value)||0;const id=e.target.id,pos=e.target.selectionStart;calcRefresh();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}});
function calcStatus(k,d){const c=S.c;if(c.calcs&&c.calcs[k])return ["ins","No relatório"];if(d.live)return ["ok","Pronta"];return d.st==="part"?["warn","Dados parciais"]:["line","Aguardando"]}
function calcList(){
  const D=calcDefs(),q=(S.c.calcQ||"").toLowerCase();
  const rows=Object.keys(D).filter(k=>D[k].n.toLowerCase().includes(q));
  return `<div class="calc"><label class="search" style="max-width:none">${ic("search","i s")}<input id="calc-q" aria-label="Buscar calculadora" placeholder="Buscar calculadora" value="${S.c.calcQ||""}"></label>
   <div class="calc-l">${rows.map(k=>{const st=calcStatus(k,D[k]);return `<button class="calc-r" data-act="calc-open" data-val="${k}"><span>${D[k].n}</span><span class="chip ${st[0]}">${st[1]}</span></button>`}).join("")||'<p class="hint">Nenhuma calculadora encontrada.</p>'}</div>
   <p class="small muted">Ativas para o agente ${PT.asst}. Peso e altura vêm do cadastro; o resultado entra no relatório como apoio.${can("sa_list")?' <a href="#calculadoras" data-go="calculadoras">Configurar calculadoras</a>':""}</p></div>`;
}
function calcTab(){
  const D=calcDefs(),k=S.calcOpen&&D[S.calcOpen]?S.calcOpen:null;
  let det='<div class="ct-empty">'+ic("gauge")+'<b>Escolha uma calculadora</b><span class="small muted">Os dados vêm do cadastro e do que foi falado no atendimento. O resultado pode entrar no relatório.</span></div>';
  if(k){const h=calcDrawer().replace(/^<div class="scrim"[^>]*><\/div><div class="drawer"[^>]*>/,"").replace(/<\/div>$/,"");det=`<div class="ct-det">${h}</div>`}
  return `<div class="ctab-calc">${calcList()}${det}</div>`;
}
const calcRefresh=()=>{if(S.c&&S.c.tab==="calc")refreshConsult(["main"]);else sideFit()};
function calcDrawer(){
  const k=S.calcOpen,D=calcDefs(),d=D[k];if(!d)return "";const wh=ptWH(),v=S.calcV||{w:wh.w,h:wh.h};
  let res="";
  if(d.live){const ok=v.w>0&&v.h>0,r=ok?d.run(v):null,ins=S.c.calcs&&S.c.calcs[k];
   res=`<div class="calc-res">${r?`<div class="big">${r[0]}<small>${r[1]}</small></div><span class="small muted">${r[2]}</span>`:'<span class="small muted">Informe valores válidos para calcular.</span>'}</div>
    <button class="btn p" data-act="calc-ins" ${r&&!(ins&&ins===r[3])?"":"disabled"}>${ins?(ins===(r&&r[3])?"Incluído no relatório":"Atualizar no relatório"):"Adicionar ao relatório"}</button>`}
  else res=`<div class="calc-res"><span class="small muted">Faltam dados para calcular. A Lya preenche conforme o atendimento avança.</span></div><button class="btn p" disabled>Adicionar ao relatório</button>`;
  return `<div class="scrim" data-act="calc-x"></div><div class="drawer" role="dialog" aria-label="${d.n}"><div class="dh"><h3>${d.n}</h3><button class="iconbtn" data-act="calc-x" aria-label="Fechar">${ic("x")}</button></div>
   <div class="db calc-d"><p class="small muted">${d.live?"Dados preenchidos a partir do cadastro. Revise antes de calcular.":"Esta calculadora precisa de mais dados."}</p>
    ${d.live?d.f.map(f=>{const orig=f[0]==="w"?wh.w:wh.h;return `<div class="field"><label for="cf-${f[0]}">${f[1]} <span class="chip ${Number(v[f[0]])===orig?"navy":"line"}">${Number(v[f[0]])===orig?"Cadastro":"Editado"}</span></label><input id="cf-${f[0]}" class="input" data-cf="${f[0]}" inputmode="decimal" value="${v[f[0]]}"></div>`}).join("")
      :d.f.map(f=>`<div class="field"><label>${f[0]}</label><input class="input" disabled placeholder="—"><span class="hint">${f[1]}</span></div>`).join("")}
    ${res}<p class="hint">O resultado entra no relatório como apoio. Interpretação e conduta continuam sendo do médico.</p></div></div>`;
}

// check-list: pendentes sobem, feitos descem riscados com o minuto em que foram cumpridos
// [item, cumprido em, obrigatório]. Para listas longas (15+): obrigatórios pendentes primeiro, até 5 pendentes à vista,
// "mais N pendentes" expande no próprio card, e só os 2 últimos concluídos aparecem
// [item, cumprido em, obrigatório]. Pendentes em cima; cumpridos descem riscados. Até 10 itens à vista; mais que isso rola dentro do card.
// [item, cumprido em]. Sem ordem obrigatória: o item é marcado quando aparece na fala, em qualquer sequência.
// Pendentes (vermelho) ficam em cima; ao ser cumprido, o item pisca em verde e desce para junto dos concluídos.
/* Atendimento com Fluxo cirúrgico: aviso fixo no topo, Dados cirúrgicos e os cartões do agente na ordem configurada. */
const OPME=[["Placa de tíbia distal 3,5 mm","OPME-10432",2],["Parafuso cortical 3,5 mm","OPME-10418",24],["Parafuso canulado 7,0 mm","OPME-10455",2],["Fio de Kirschner 2,0 mm","OPME-10301",10],["Fixador externo linear","OPME-10620",1]];
const OPME_DIT={0:[22,1],1:[30,6]};
function opmeSync(t){const c=S.c;c.opme=c.opme||{};Object.entries(OPME_DIT).forEach(([i,v])=>{if(t>=v[0]&&c.opme[i]==null)c.opme[i]={q:v[1],src:"dit",at:v[0],on:true}})}
function opmeHtml(t){const c=S.c;opmeSync(t);const sel=Object.keys(c.opme).filter(i=>c.opme[i].on);
 return `<p class="small muted" style="margin:0">Material disponível para esta cirurgia. Dite o que usou ou marque aqui.</p><ul class="opme">${OPME.map((o,i)=>{const s=c.opme[i],on=s&&s.on;return `<li class="${on?"on":""}"><label><input type="checkbox" data-opme="${i}" ${on?"checked":""}><span><b title="${o[0]}">${o[0]}</b><small class="mono">${o[1]} · ${o[2]} disp.</small></span></label>${on?`<span class="opq"><button data-act="opq" data-val="${i}:-1" aria-label="Menos ${o[0]}">−</button><span class="mono">${s.q}</span><button data-act="opq" data-val="${i}:1" aria-label="Mais ${o[0]}">+</button></span>${s.src==="dit"?`<span class="chip lil">Ditado ${mmss(s.at)}</span>`:`<span class="chip line">Marcado</span>`}`:""}</li>`}).join("")}</ul><div class="opme-f">${sel.length} ${sel.length===1?"item entra":"itens entram"} no relatório em <b>OPME codificado</b></div>`}
/* Relatório montado pelos itens do momento "Relatório" do agente (até 3 Prompts e 2 Agentes), na ordem configurada.
   Cada bloco recebe a saída de um item do back-end: data-rep-item traz o nome e o tipo para o front encaixar a resposta. */
function repBlocks(first){const c=S.c,items=agcOf(c.ag||S.prep.as).rep;if(!items.length)return first;
 const gen=c.phase==="gen",skel=`<div class="ns todo"><span class="nd" aria-hidden="true"></span><div><span class="skel"></span></div></div>`;
 const body=(n,t,k)=>k===0?first:gen?skel:t==="agente"&&n==="OPME codificado"?opmeSec(true):repOut(n);
 const nav=items.length>1?`<nav class="rep-nav" aria-label="Partes do relatório">${items.map((x,k)=>`<button data-act="rep-jump" data-val="${k}">${x[0]}</button>`).join("")}</nav>`:"";
 return nav+items.map((x,k)=>`<section class="rep-b" id="rep-b-${k}" data-rep-item="${x[0]}" data-rep-type="${x[1]}">${items.length>1?`<h3 class="rep-h">${x[0]}</h3>`:""}${body(x[0],x[1],k)}</section>`).join("")}
function repOut(n){const c=S.c,ns=(t,h)=>`<div class="ns done"><span class="nd" aria-hidden="true"></span><div>${t?`<h4>${t}</h4>`:""}${h}</div></div>`;
 if(n==="Conduta estratificada")return ns("Imediata",`<p>${CS.receita[1]}</p>`)+ns("Investigação",`<p>${CS.exames.join("; ")}.</p>`)+ns("Seguimento",`<p>${CS.sent}</p>`);
 if(n==="Exames complementares")return ns("",`<ol class="small" style="margin:0;padding-left:18px">${CS.exames.map(e=>`<li>${e}</li>`).join("")}</ol><p class="small muted" style="margin:6px 0 0">Indicação clínica: ${CS.exInd}</p>`);
 if(n==="Auditoria do conteúdo"){const pend=C_REV.filter(r=>!c.res[r[0]]);const ok=c.cir?["Identificação e lateralidade","Procedimento principal e código","Equipe completa","OPME com quantidade"]:["Queixa e história","Alergias","Plano e retorno"];
  return ns("",`<ul class="aud">${ok.map(o=>`<li class="ok">${ic("check","i s")}${o}</li>`).join("")}${pend.map(r=>`<li class="pend">${ic("alert","i s")}${r[1]}</li>`).join("")}</ul><p class="small muted" style="margin:6px 0 0">${pend.length?`${pend.length} ${pend.length>1?"itens":"item"} para conferir antes de enviar.`:"Nada pendente."}</p>`)}
 return ns("",`<p class="small muted">A saída do Prompt “${n}” aparece aqui.</p>`)}

function chkList(items,t){
  const pend=items.filter(x=>t<x[1]),done=items.filter(x=>t>=x[1]).sort((a,b)=>b[1]-a[1]);
  const li=(x,ok)=>`<li data-flip="c-${x[0]}" class="${ok?"ok":""} ${ok&&t-x[1]<3?"just":""}" title="${x[0]}"><span class="c ${ok?"ok":""}"></span><span class="tx">${x[0]}</span></li>`;
  return {done:done.length,html:`<ul class="qs chk3">${pend.map(x=>li(x,false)).join("")}${done.map(x=>li(x,true)).join("")}</ul>`};
}

// Prompts do miolo: largura em colunas (1 ou 2) configurável por card; o check-list ocupa uma faixa fixa à direita
const SA_SIZE={alg:1,qx:1,hip:2,abc:2};
function saAreas(keys,cap){const rows=[];let row=[];keys.forEach(k=>{const n=SA_SIZE[k]||1;if(row.length+n>2){rows.push(row);row=[]}for(let i=0;i<n;i++)row.push(k);if(row.length>=2){rows.push(row);row=[]}});if(row.length)rows.push([...row,row[0]]);
  return (cap?'"cap cap cap" ':"")+rows.map(r=>`"${r.join(" ")} chk"`).join(" ")}
function saGrid(){return CS===CASES.derm?saGridDerm():saGridRcu()}
function capCard(t){
  const ok=S.c&&S.c.ptok;
  const row=(l,v,at)=>`<div class="cap-r ${t>=at?"in":""}"><span class="pp-l">${l}</span><span class="pp-v">${t>=at?v:'<span class="muted">aguardando a fala</span>'}</span><span class="ts">${t>=at?(at?mmss(at):"digitado"):""}</span></div>`;
  return `<div class="sa capc ${t>=3&&!ok?"flash-soft":""}" style="grid-column:1/-1"><div class="sa-h"><b>${ic("user","i s")}Dados do paciente captados da fala</b>${ok?'<span class="chip ok">Confirmado</span>':t>=8?'<span class="chip warn">Confirme</span>':'<span class="chip line">Ouvindo</span>'}</div>
   <div class="cap-g">${row("Nome","Fernando Oliveira",0)}${row("Nascimento","01/07/1995 · 31 anos",3)}${row("Peso","55 kg",8)}${row("Altura","1,70 m",8)}${row("IMC","19,0 kg/m² · calculado",8)}</div>
   ${t>=8&&!ok?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn live sm" data-act="c-ptok" data-val="cap">Confirmar dados</button><button class="btn g sm" data-act="c-pt">Revisar na ficha</button><span class="small muted">“Primeiro de set” foi entendido como julho. Confira antes de confirmar.</span></div>`:""}</div>`;
}
function capStrip(t){
  const it=(l,v,at)=>`<span class="cs-i ${t>=at?"in":""}"><small>${l}</small><b>${t>=at?v:'<span class="muted">aguardando</span>'}</b>${t>=at&&at?evT(at):""}</span>`;
  return `<div class="sa capstrip ${t>=3?"flash-soft":""}"><span class="cs-t">${ic("user","i s")}Captado da fala</span>${it("Nascimento","01/07/1995 · 31 anos",3)}${it("Peso","55 kg",8)}${it("Altura","1,70 m",8)}${t>=8?`<span class="cs-a"><button class="btn p sm" data-act="c-ptok" data-val="cap">Confirmar</button><button class="btn g sm" data-act="c-pt" title="“Primeiro de set” foi entendido como julho. Confira.">Revisar</button></span>`:'<span class="chip line cs-a">Ouvindo</span>'}</div>`;
}
function saGridDerm(){
  const t=S.c?S.c.t:C_END, wait=`<span class="small muted">Ainda não identificado no atendimento</span>`;
  const ts=x=>`<span class="ts">${t>=x?mmss(x):"aguardando"}</span>`;
  const abc=[["A","Assimetria","não descrita",0],["B","Bordas","irregulares",1],["C","Cor","escura, heterogênea",1],["D","Diâmetro","≈ 20 mm (> 6 mm)",1],["E","Evolução","cresceu e escureceu · questionário",1]];
  const ck=chkList([["Lesão descrita",17,1],["Critérios ABCDE avaliados",19,1],["História familiar perguntada",26],["Exposição solar avaliada",999],["Fotografia da lesão",999,1],["Consentimento do procedimento",999,1],["Anatomopatológico solicitado",31,1],["Fio de sutura registrado",38],["Orientação de curativo",44],["Retorno definido",44]],t);
  return `<div class="sagrid rt derm" style='--areas:${saAreas(["alg","qx","hip"],!(S.c&&S.c.ptok))}'>${S.c&&S.c.ptok?"":`<div class="a-cap">${capStrip(t)}</div>`}
  <div class="sa a-qx"><div class="sa-h"><b>Queixa principal</b>${ts(12)}</div>${t>=8?`<div class="chips">${t>=12?'<span class="chip navy">Lesão pigmentada no antebraço</span>':""}<span class="chip navy">Perda de 15 kg</span>${evT(8)}${t>=12?evT(12):""}</div>`:wt("qx")}</div>
  <div class="sa a-alg"><div class="sa-h"><b>${ic("alert","i s")}Alergias</b>${ts(1)}</div><span class="small muted">Nenhuma alergia relatada até agora. Pergunte antes de prescrever.</span></div>
  <div class="sa a-hip ${t>=19?"crit":""}"><div class="sa-h"><b>Hipóteses diagnósticas</b>${t>=19?'<span class="chip red mono">ABCDE 4/5</span>':ts(19)}</div>${t>=19?hyp2([["Lesão melanocítica a esclarecer","D48.5",70,[17,"questionário 25/10"]],["Perda de peso anormal","R63.4",t>=26?55:45,[8]]],t,`<div class="abc-mini" title="Sinais de alerta da lesão">${abc.map(a=>`<span class="${a[3]?"hit":""}" title="${a[1]}: ${a[2]}"><b>${a[0]}</b>${a[1]}</span>`).join("")}</div>`):wt("hip")}</div>
  <div class="sa a-chk"><div class="sa-h"><b>Check-list do procedimento</b></div>${ck.html}</div></div>`;
}

const flipSnap=()=>{const m={};document.querySelectorAll("#c-main [data-flip]").forEach(e=>m[e.dataset.flip]=e.getBoundingClientRect().top);return m};
function flipPlay(m){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  document.querySelectorAll("#c-main [data-flip]").forEach(e=>{const k=e.dataset.flip,top=e.getBoundingClientRect().top;
   if(k in m){const dy=m[k]-top;if(Math.abs(dy)>1)e.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],{duration:520,easing:"cubic-bezier(.2,.7,.2,1)"})}
   else if(Object.keys(m).length)e.animate([{opacity:0,transform:"translateY(-6px)"},{opacity:1,transform:"none"}],{duration:380,easing:"ease-out"})});
}
function fitMain(){const m=document.getElementById("c-main");if(!m)return;document.documentElement.style.setProperty("--cm-top",Math.round(m.getBoundingClientRect().top+window.scrollY)+"px");const sd=document.getElementById("c-side");if(sd)document.documentElement.style.setProperty("--cs-top",Math.round(sd.getBoundingClientRect().top+window.scrollY)+"px")}
function tabsFit(){fitMain();const w=document.getElementById("c-tabs");if(!w)return;const sc=w.querySelector(".ct-scroll");if(!sc)return;const upd=()=>{w.classList.toggle("ovf",sc.scrollWidth>sc.clientWidth+2);w.classList.toggle("end",sc.scrollLeft+sc.clientWidth>=sc.scrollWidth-2);w.classList.toggle("st",sc.scrollLeft>2)};const on=sc.querySelector("button.on");if(on){const l=on.offsetLeft,r=l+on.offsetWidth;if(l<sc.scrollLeft||r>sc.scrollLeft+sc.clientWidth)sc.scrollLeft=Math.max(0,r-sc.clientWidth+24)}upd();sc.onscroll=upd}
addEventListener("resize",()=>tabsFit());
function sideFit(){const el=document.getElementById("c-slide");if(!el)return;const key=S.c?(S.c.pOpen||S.calcOpen||(S.logOpen?"log":"")):"";const h=slideHtml();const isNew=key&&key!==sideFit.k;sideFit.k=key;el.innerHTML=h;const p=el.querySelector(".spanel");if(p){if(isNew)p.classList.add("in");const cb=document.querySelector(".cbody"),top=cb.getBoundingClientRect().top,sd=document.getElementById("c-side"),cr=cb.getBoundingClientRect();el.style.right="auto";el.style.left=(sd?sd.getBoundingClientRect().left-cr.left:Math.max(0,cr.width-420))+"px";el.style.width=(sd?sd.getBoundingClientRect().width:420)+"px";p.style.height=Math.max(360,innerHeight-top-12)+"px"}}

function refreshConsult(parts){setTimeout(fitMain,0);

 const has=re=>sents.filter(x=>re.test(seNorm(x)));const n=seNorm(f.n);const key=(SE_KEYS.find(([re])=>re.test(n))||[])[1];

  case"queixa":return sents[0]?sents[0].slice(0,120):null;
  case"historia":return sents.slice(0,3).join(" ").slice(0,200)||null;

  case"exame":{const h=has(/exame fisico|ausculta|ao exame|sem sopro|pulmoes|abdome/);return h.length?h.join(" ").slice(0,160):null}

const GERAL_RX=/^(qual|quais|o que|como)\b.*\b(dose|posologia|diretriz|protocolo de|crit[eé]rio|defini[cç][aã]o|tratamento de|indica[cç][aã]o)\b|amoxicilina|dose de|o que [eé]/i;
const PAC_RX=/\b(paciente|ele|ela|dele|dela|paulo|fernando|este atendimento|até agora|resum|faltam|intera|escore|risco|alergi|atestado|documento|orienta)/i;
function chatScopeOf(q){const {inC}=chatCtx();if(!inC)return "geral";if(S.chatScope==="geral")return "geral";return GERAL_RX.test(q)&&!PAC_RX.test(q)?"geral":"pac"}
function chatAsk(q,fid){if(!q||!q.trim())return;S.cite=null;const files=fid&&S.chatFiles&&S.chatFiles[fid]?S.chatFiles[fid].splice(0):[];S.chatPr=null;if(useBlocked("perg")){toast("Limite de perguntas do mês atingido");return}useAdd("perg");if(/chamado|suporte|senha|login|meu plano|pagamento|fatura|como (eu )?(gero|fa[çc]o|crio|configuro|instalo|uso a lya)|n[aã]o (est[aá] )?funciona|erro na (lya|plataforma)/i.test(q)){S.chatMsgs.push({q:q.trim(),a:"Essa é uma dúvida sobre a plataforma, então quem responde é a Ajuda da Lya. Lá eu não levo os dados do paciente.",src:[],help:q.trim()});return}const {inC}=chatCtx();const sc=chatScopeOf(q);const [a,src,ttl]=answerFor(q,inC&&sc==="pac");S.chatMsgs.push({q:q.trim(),a:files.length?`<p class="small muted">${ic("file","i s")} Li ${files.length>1?`${files.length} arquivos`:`o arquivo ${files[0]}`} para responder.</p>`+(/^<(p|ul)/.test(a)?a:`<p>${a}</p>`):a,src,ttl,sc:inC?sc:null,auto:inC&&S.chatScope!=="geral"&&sc==="geral",files});S.chatPlus=false;S.chatFontes=false;S.chatDocs=null}
function chatThread(){
  const {inC}=chatCtx();
  if(!S.chatMsgs.length){
    const sug=inC&&S.c.phase!=="live"?CHAT_QUICK_REV:inC?[["doc","Resumir até agora","Resuma até agora"],["list","Perguntas que faltam","Que perguntas ainda faltam?"],["alert","Interações e alergias","Checar interações"],["gauge","Escore de gravidade","Calcular escore de risco"]]:[["flask","Dose de medicamento","Dose de amoxicilina para sinusite em adulto?"],["alert","Interações entre medicamentos","Interações entre losartana e ibuprofeno"],["file","Gerar um atestado","Gerar atestado de 3 dias"],["book","Buscar protocolo da instituição","Protocolo de sepse da instituição"]];
    return `<div class="ch-empty"><span class="ch-logo">${ic("spark")}</span><h2>Olá, Dra. Helena</h2>${inC?`<p class="muted ch-intro">Posso resumir o atendimento, checar interações e alergias e buscar nos protocolos da instituição, sempre mostrando a fonte.</p>`:`<p class="muted">Como posso ajudar hoje?</p>`}
     <div class="ch-sug">${sug.map(s=>`<button data-act="c-ask" data-val="${s[2]}">${ic(s[0]==="book"?"doc":s[0],"i s")}<span>${s[1]}</span></button>`).join("")}</div></div>`;
  }
  return S.chatMsgs.map((m,i)=>`<div class="ch-u">${m.files&&m.files.length?`<div class="ch-files r">${m.files.map(f=>`<span class="ch-file">${ic("file","i s")}${f}</span>`).join("")}</div>`:""}<p>${m.q}</p></div>
   <div class="ch-a"><span class="ch-av">${ic("spark","i s")}</span><div class="ch-at">${m.sc?`<span class="ch-scope ${m.sc}">${m.sc==="pac"?`${ic("user","i s")}Sobre ${PT.nome} · fica no registro do atendimento`:`${ic("search","i s")}Pergunta geral · sem dados do paciente${m.auto?" (detectada pela Lya)":""}`}</span>`:""}${m.src.length&&CITE[m.src[0]]?`<div class="ch-found">${ic("search","i s")}${m.ttl?`<b>${m.ttl}</b> · `:""}${m.src.length} ${m.src.length>1?"fontes consultadas":"fonte consultada"}</div>`:""}${/^<(p|ul)/.test(m.a)?citeChips(i,m.a):`<p>${m.a}</p>`}${m.help?`<button class="btn t sm" style="justify-self:start" data-act="lya-to-help" data-val="${i}">${ic("help","i s")}Ir para a Ajuda</button>`:""}${m.src.length&&CITE[m.src[0]]?citeRefs(i,m.src):m.src.length?`<div class="ch-src">${m.src.map((x,j)=>`<span class="cite">${j+1} · ${x}</span>`).join("")}</div>`:""}

     <span class="sp"></span>${inC&&m.sc!=="geral"&&can("at_criar")?`<button class="btn q sm" data-act="chat-act" data-val="${S.c&&S.c.phase==="sent"?"Inserido como adendo ao relatório integrado":"Inserido no relatório como pendência de revisão"}">${ic("doc","i s")}${S.c&&S.c.phase==="sent"?"Inserir como adendo":"Inserir no relatório"}</button>`:""}${can("at_criar")?`<div class="dd"><button class="btn q sm" data-act="chat-docs" data-val="${i}">${ic("file","i s")}Gerar documento</button>${S.chatDocs===String(i)?`<div class="dd-menu up" role="menu">${CHAT_DOCS.map(d=>`<button role="menuitem" data-act="chat-act" data-val="${d}: rascunho criado na aba do documento">${d}</button>`).join("")}</div>`:""}</div>`:""}</div>
   </div></div>`).join("");
}
/* Prompts salvos: textos prontos que o médico usa no chat; digitar "/" no começo do campo também abre a lista */
const SAVED_PROMPTS=[["Dose ajustada pela função renal","Qual a dose de [medicamento] para clearance de [valor] mL/min?"],["Interação entre medicamentos","Há interação entre [medicamento A] e [medicamento B]?"],["Resumo de diretriz","Resuma a diretriz mais recente sobre [tema] em 5 pontos."],["Explicar ao paciente","Explique [condição] para o paciente em linguagem simples."],["Diagnóstico diferencial","Quais diagnósticos diferenciais para [quadro]?"]];

const chatFileBtn=(id,menu)=>`<label class="${menu?"dd-fl":"hask-fl"}" role="${menu?"menuitem":"button"}" title="PDF, imagem ou documento · a Lya lê para responder">${ic("clip","i s")}${menu?" Anexar arquivo":"Arquivos"}<input type="file" data-chatfile="${id}" accept=".pdf,image/*,.doc,.docx" multiple hidden></label>`;
function chatComposer(o){
  o=o||{};const id=o.id||"chat-in";
  const {inC}=chatCtx();
  const fontes=[["pront",isB2C()?"Atendimentos na Lya":"Prontuário"],["proto","Protocolos da instituição"],["lit","Literatura"]];
  const on=fontes.filter(f=>S.chatSrc[f[0]]).length;
  const menu=S.chatMenuFor===id;
  const scope=inC&&!o.big?`<div class="ch-scopes" role="group" aria-label="Escopo da pergunta"><button class="${S.chatScope!=="geral"?"on":""}" data-act="chat-scope" data-val="pac">${ic("user","i s")}Sobre ${PT.nome.split(" ")[0]}</button><button class="${S.chatScope==="geral"?"on":""}" data-act="chat-scope" data-val="geral">${ic("search","i s")}Pergunta geral</button></div>`:"";
  if(useBlocked("perg"))return scope+useWall("perg");
  return scope+`<div class="ch-comp ${o.big?"big":""}">
   ${(S.chatFiles||{})[id]&&S.chatFiles[id].length?`<div class="ch-files">${S.chatFiles[id].map((f,k)=>`<span class="ch-file">${ic("file","i s")}${f}<button data-act="chat-unfile" data-val="${id}|${k}" aria-label="Remover ${f}">${ic("x","i s")}</button></span>`).join("")}</div>`:""}
   ${o.big?"":promptsPop(id)}
   <textarea id="${id}" rows="${o.big?2:1}" aria-label="Pergunta para a Lya" placeholder="${o.ph||(inC?"Pergunte o que quiser sobre este paciente":"Fale com a Lya")}"></textarea>
   <div class="ch-row">
    <div class="dd"><button class="ch-ico bare" data-act="chat-plus" data-val="${id}" aria-label="Mais opções" aria-expanded="${menu&&S.chatPlus}">${ic("plus")}</button>${menu&&S.chatPlus?`<div class="dd-menu ${o.big?"":"up"}" role="menu">${chatFileBtn(id,true)}<button role="menuitem" data-act="chat-prompts" data-val="${id}">${ic("list","i s")} Prompts salvos</button></div>`:""}</div>
    <span class="sp"></span>
    <div class="dd"><button class="ch-mode" data-act="chat-fontes" data-val="${id}" aria-expanded="${menu&&S.chatFontes}">Fontes <span class="muted">${on} de 3</span> ${ic("chev","i s chev-d")}</button>${menu&&S.chatFontes?`<div class="dd-menu ${o.big?"":"up"} right" role="menu">${fontes.map(([k,l])=>`<button role="menuitemcheckbox" aria-checked="${!!S.chatSrc[k]}" data-act="chat-src" data-val="${k}"><span class="ck ${S.chatSrc[k]?"on":""}">${S.chatSrc[k]?ic("check","i s"):""}</span>${l}</button>`).join("")}</div>`:""}</div>
    <button class="ch-ico bare ${S.dict===id?"rec":""}" data-act="chat-dict" data-val="${id}" aria-label="${S.dict===id?"Ouvindo a pergunta":"Ditar pergunta"}" title="${S.dict===id?"Ouvindo…":"Ditar pergunta"}">${ic("mic")}</button>
    <button class="ch-send" data-act="chat-send" data-val="${id}" aria-label="Enviar">${ic("up","i s")}</button>
   </div></div>${o.big?"":`<p class="ch-foot">${useLine("perg")||"A Lya pode errar. Confira as fontes; a conduta é do médico."}</p>`}`;
}

function calcSrcGuess(l){l=l.toLowerCase();if(/weight|height|age|sex|peso|altura|idade|sexo/.test(l))return "cad";if(/creatin|sodium|potass|chlorid|bicarb|albumin|hemoglob|glucose|bun|urea|cholest|hdl|triglyc|bilirub|inr|platelet|wbc|hematocrit|calcium|ast|alt|ph|pao2|lactate|troponin/.test(l))return "dc";if(/heart rate|pulse|blood pressure|systolic|temperature|respiratory|map|gcs|glasgow|spo2|saturation/.test(l))return "fala";return "dig"}

function calcCfgList(q,sec,st){
  const f=CALC_CAT.filter(c=>(!sec||c.sec===sec)&&(!q||(c.t+" "+c.s+" "+c.f).toLowerCase().includes(q))&&(st==="todas"||(st==="on"&&calcCfg(c.id).on)||(st==="off"&&!calcCfg(c.id).on)||(st==="rv"&&c.rv)));
  if(!f.length)return '<p class="hint">Nenhuma calculadora encontrada.</p>';

}

 Object.entries(palVars(P[dark?3:2])).forEach(([k,v])=>r.style.setProperty(k,v));try{localStorage.setItem("lya-pal",id)}catch(e){}}
try{new MutationObserver(()=>{if(S.pal)applyPal(S.pal)}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.pal)applyPal(S.pal)})}catch(e){}
/* Controles do protótipo: simulam quem usa, o cenário da tela atual e a aparência.
   Não fazem parte da Lya; servem para quem constrói ver cada estado que a plataforma precisa ter. */
const PD_GO=["inicio","chat","historico","pacientes","conhecimento","smartapps","assistentes","usuarios","perfis","grupos","governanca","auditoria","relatorios","integracao","cirurgia","configuracoes","conta","planos","suporte","ajuda"];
function protoDock(){
  const atd=S.c&&(S.route==="atendimento"||S.route==="relatorio")&&S.c.phase==="live";
  const seg=(act,cur,opts)=>`<div class="seg">${opts.map(o=>`<button class="${cur===o[0]?"on":""}" data-act="${act}" data-val="${o[0]}">${o[1]}</button>`).join("")}</div>`;
  const f=(l,ctl,d)=>`<div class="pd-f"><span>${l}</span>${ctl}${d?`<small class="pd-d">${d}</small>`:""}</div>`;
  const sec=(k,t,body,open)=>{S.pdSec=S.pdSec||{};const o=S.pdSec[k]==null?open:S.pdSec[k];return `<details class="pd-sec" data-pdsec="${k}" ${o?"open":""}><summary>${t}${ic("chev","i s")}</summary><div class="pd-b">${body}</div></details>`};
  const b2c=isB2C(),P=PALS[S.pal||"azul"];
  /* cenário: só o que muda a tela aberta agora */
  let cen="";
  if(!b2c&&["inicio","atendimento","relatorio","pacientes"].includes(S.route))cen+=f("Tipo de atendimento",seg("pd-case",agcOf(S.prep.as).flux?"cir":"clin",[["clin","Clínico"],["cir","Cirúrgico"]]),"Cirúrgico: agente Ortopedia · Cirurgia, com aviso, procedimentos e equipe antes de iniciar, OPME e descrição cirúrgica.");
  if(S.route==="inicio"){
   cen+=f("Paciente",seg("pd-empty",S.emptyDay?"1":"0",[["0","Com paciente"],["1","Sem paciente"]]),b2c?"Sem paciente: ninguém escolhido ainda; a Lya pede o nome antes do relatório.":"Sem paciente: nenhum paciente na espera nem atendimento aberto.");
   cen+=f("Microfone",seg("pd-mic",S.micOff?"1":"0",[["0","Com sinal"],["1","Sem sinal"]]),"Sem sinal: aviso e botão de iniciar bloqueado.");
  }
  if(atd)cen+=f("Velocidade da simulação",seg("c-speed",String(S.c.speed),[["1","1x"],["4","4x"]]),"Acelera a transcrição e os alertas ao vivo.");
  if(!b2c&&["atendimento","relatorio","historico","inicio"].includes(S.route))cen+=f("Integração com o prontuário",seg("pd-int",S.intFail?"1":"0",[["0","Envia com sucesso"],["1","Falha no 1º envio"]]),"Falha: o envio vai para Atendimentos › Erro de envio.");
  cen+=f("Notificações",seg("pd-notif",S.notifRead?"1":"0",[["0","Com novas"],["1","Todas lidas"]]));
  return `<div class="pdock ${S.pdock?"open":""}">${S.pdock?`<div class="pd-panel" role="dialog" aria-label="Controles do protótipo">
   <div class="pd-h"><b>Controles do protótipo</b><span class="small muted">Simulam cenários para orientar a construção. Não fazem parte da Lya.</span></div>
   ${sec("quem","Quem está usando",
     f("Ver como",`<select data-act="viewas" aria-label="Ver como">${VIEWAS.map(v=>`<option value="${v}" ${v===S.role?"selected":""}>${prof(v).name}</option>`).join("")}</select>`,b2c?"Médico particular: é o cliente e controla o plano.":"Hospital: o perfil define menu, permissões e telas.")
     +(b2c?f("Plano",seg("pd-plan",S.b2cPlan||"free",[["free","Gratuito"],["pro","Unlimited"]])):"")
     +f("Uso do plano",seg("pd-use",S.useLvl||"ok",[["ok","Normal"],["near","Perto do limite"],["out","Esgotado"]]),"Mostra os avisos e as travas de uso.")+(can("as_edit")&&!can("sa_rt")?f("Contrato",seg("pd-ctr",S.contractRT===false?"0":"1",[["1","Tempo real habilitado"],["0","Sem tempo real"]]),"O administrador da organização só usa Prompts e Funções agente de tempo real se o contrato habilitar."):""),true)}
   ${sec("cen",`Cenário · ${TITLES[S.route]||"esta tela"}`,cen,true)}
   ${sec("nav","Navegar",
     f("Ir para a tela",`<select data-pdgo aria-label="Ir para a tela">${PD_GO.filter(r=>(r!=="planos"||b2c)&&(!GUARD[r]||can(GUARD[r]))).map(r=>`<option value="${r}" ${r===S.route?"selected":""}>${TITLES[r]}</option>`).join("")}</select>`)
     +`<button class="btn g sm" style="justify-self:start" data-act="go-login">${ic("user","i s")}Começar pelo login</button><button class="btn g sm" style="justify-self:start" data-act="sess-exp">${ic("lock","i s")}Simular sessão expirada</button>`,false)}
   ${sec("cor",`Cores <span class="pd-cur"><span class="pal-sw">${[0,4,7].map(i=>`<i style="background:${P[2][i]}"></i>`).join("")}</span>${P[0]}</span>`,`<div class="pal-l">${Object.entries(PALS).map(([k,Q])=>`<button class="pal-o ${(S.pal||"lilas")===k?"on":""}" data-act="pal" data-val="${k}" aria-pressed="${(S.pal||"lilas")===k}"><span class="pal-sw">${[0,4,7].map(i=>`<i style="background:${Q[2][i]}"></i>`).join("")}</span><span class="pal-t"><b>${Q[0]}</b><small>${Q[1]}</small></span></button>`).join("")}</div>`,false)}
  </div>`:""}
   <button class="pd-btn" data-act="pdock" aria-expanded="${!!S.pdock}" title="Controles do protótipo">${ic("sliders","i s")}Protótipo · ${prof(S.role).name}</button></div>`;
}
/* Porta única da Lya: modo Clínico (Fale com a Lya, só onde há paciente ou contexto clínico)
   e modo Ajuda (chatbot da plataforma, em todas as telas; abre chamados sem dados de paciente). */
const CLIN_ROUTES=["inicio","atendimento","relatorio","anterior","pacientes","paciente","historico","chat","cadastro","questionario","preparar"];
const isClinRoute=()=>CLIN_ROUTES.includes(S.route)&&canChat();
function renderFab(){
  const el=document.getElementById("fab");
  if(S.route==="login"){el.innerHTML=protoDock();return}
  const side=inSideChat(),clin=isClinRoute();
  if(!clin&&S.lyaMode!=="help")S.lyaMode="help";
  const mode=S.lyaMode||"clin";
  const noBtn=S.chatOpen||side||["chat","inicio"].includes(S.route);
  const btn=noBtn?"":`<button class="fab2 ${clin?"":"help"}" data-act="fab" title="${clin?"Fale com a Lya (Ctrl + J)":"Ajuda da Lya: dúvidas e chamados"}">${ic(clin?"spark":"help","i s")}<span>Lya</span></button>`;
  let panel="";
  if(S.chatOpen){
   const canClin=clin&&!side;
   const sw=canClin?`<div class="lya-mode" role="tablist" aria-label="Modo"><button role="tab" aria-selected="${mode==="clin"}" class="${mode==="clin"?"on":""}" data-act="lya-mode" data-val="clin">${ic("spark","i s")}Clínico</button><button role="tab" aria-selected="${mode==="help"}" class="${mode==="help"?"on":""}" data-act="lya-mode" data-val="help">${ic("help","i s")}Ajuda</button></div>`:"";
   const {label}=chatCtx();
   const head=mode==="help"?`<div style="flex:1;min-width:0"><b>Ajuda da Lya</b><small>Dúvidas sobre a plataforma e chamados</small></div>`:`<div style="flex:1;min-width:0"><b>Fale com a Lya</b><small>${label}</small></div>`;
   const tools=mode==="help"?`<button class="iconbtn sm" data-act="help-new" aria-label="Nova conversa" title="Nova conversa">${ic("edit","i s")}</button>`:`<button class="iconbtn sm" data-act="chat-new" aria-label="Nova conversa" title="Nova conversa">${ic("edit","i s")}</button><button class="iconbtn sm" data-act="fab-full" aria-label="Abrir em tela cheia" title="Tela cheia">${ic("grid","i s")}</button>`;
   panel=`<aside class="chpanel ${mode==="help"?"is-help":""}" role="dialog" aria-label="${mode==="help"?"Ajuda da Lya":"Fale com a Lya"}">
    <header>${head}${tools}<button class="iconbtn sm" data-act="fab-x" aria-label="Fechar" title="Fechar">${ic("x","i s")}</button></header>${sw}
    ${mode==="help"?helpBody():`<div class="ch-body" id="ch-body">${chatThread()}</div>${chatComposer()}`}</aside>`;
  }
  el.innerHTML=protoDock()+btn+panel;
  const b=document.getElementById(mode==="help"?"hp-body":"ch-body");if(b)b.scrollTop=b.scrollHeight;
}

const HELP_KEYS=[["Tab","Vai para o próximo campo ou botão"],["Shift + Tab","Volta para o anterior"],["Enter ou Espaço","Aciona o botão, o cartão ou a linha em foco"],["Esc","Fecha menu, painel ou janela e devolve o foco"],["← →","Anda entre abas, opções e estrelas"],["Ctrl + J","Abre o Fale com a Lya"],["/","No campo de pergunta, abre as perguntas prontas"]];
function helpCtxCard(){const c=HELP_CTX[S.route];if(!c)return "";return `<div class="hp-ctx" role="group" aria-label="Ajuda desta tela"><h3>${ic("help","i s")}Nesta tela · ${c[0]}</h3><p class="small muted" style="margin:0">${c[1]}</p><ul>${c[2].map(x=>`<li>${x}</li>`).join("")}</ul><div class="chips"><button class="chip navy" data-act="help-ask" data-val="Como uso esta tela?">Como uso esta tela?</button>${c[3].map(q=>`<button class="chip line" data-act="help-ask" data-val="${q}">${q}</button>`).join("")}</div></div>`}
const HELP_TOPICS=[["grid","Atalhos de teclado","Quais atalhos de teclado posso usar?"],["mic","Transcrição e atendimento","Como funciona a transcrição do atendimento?"],["apps","Prompts","O que são Prompts?"],["layers","Agentes","Como escolho ou copio um agente?"],["doc","Documentos e Prescrição","Como gero a prescrição na Memed?"],["lock","Conta e Acesso","Esqueci minha senha"],["file","Planos e Pagamentos","Como mudo meu plano?"]];
function helpAnswer(q){
  const t=q.toLowerCase();
  if(/atalho|teclado|\btab\b|navegar sem mouse/.test(t))return {a:"Dá para usar a Lya só com o teclado. "+HELP_KEYS.map(k=>k[0]+": "+k[1]).join(". ")+".",doc:"Guia · Teclado e acessibilidade"};
  if(/(esta|nesta) tela|como uso/.test(t)){const c=HELP_CTX[S.route];if(c)return {a:c[0]+": "+c[1]+" "+c[2].join(" "),doc:"Guia · "+c[0]}}
  if(/dose|intera|diagn|conduta|exame d|cid|paciente|alergi|medica/.test(t))return {a:"Isso parece uma pergunta clínica. Quem responde é o Fale com a Lya, que trabalha com o contexto do paciente. Aqui na Ajuda eu não uso dados de pacientes.",clin:q};
  if(/transcri|grava|microfone|atendimento/.test(t))return {a:"A Lya transcreve o atendimento enquanto você conversa. Ao clicar em Iniciar atendimento, a Lya começa a ouvir; dá para pausar e continuar. Ao gerar o relatório, o áudio é apagado. Se o microfone não captar, confira o dispositivo em Minhas preferências.",doc:"Guia do médico · Atendimento"};
  if(/smart ?app|prompt/.test(t))return {a:"Prompts são pequenas funções de IA que rodam no atendimento, como Alergias, Queixa principal e Check-list. Cada agente define quais Prompts aparecem. Quem tem permissão cria ou edita em Inteligência › Prompts.",doc:"Guia do gestor · Prompts"};
  if(/agente|assistente/.test(t))return {a:"O agente define como a Lya trabalha no atendimento: os Prompts, o check-list e o modelo do relatório. Escolha o agente no cartão Iniciar atendimento. Os agentes prontos da Lya podem ser copiados e ajustados em Inteligência › Agentes.",doc:"Guia do gestor · Agentes"};
  if(/memed|prescri|receita|documento|atestado/.test(t))return {a:"Depois de gerar o relatório, a aba Prescrição abre já preenchida na Memed. Documentos como atestado e orientações saem pelo botão Criar, ao lado das abas do atendimento, e só são emitidos depois da sua assinatura.",doc:"Guia do médico · Documentos"};
  if(/senha|login|acesso|entrar|2fa|duas etapas/.test(t))return {a:"Para trocar a senha, vá em Minha conta › Meu perfil › Trocar senha. Enviamos um link para o seu e-mail. Se não conseguir entrar, abra um chamado que o time de suporte libera o acesso.",doc:"Conta e acesso"};
  if(/plano|pagamento|fatura|cobran|cart[aã]o|nota fiscal/.test(t))return {a:"Plano, forma de pagamento e notas fiscais ficam em Minha conta › Faturamento. Em hospitais e clínicas, a cobrança é feita pela instituição.",doc:"Planos e pagamentos"};
  if(/chamado|suporte|erro|bug|n[aã]o funciona|travou/.test(t))return {a:"Posso abrir um chamado para o time de suporte agora. Ele já vai com o resumo desta conversa, a tela e a versão. Não inclua dados de pacientes.",ticket:true};
  return {a:"Não encontrei isso na documentação. Quer que eu abra um chamado para o time de suporte?",ticket:true};
}
function helpAsk(q){if(!q||!q.trim())return;S.helpMsgs=S.helpMsgs||[];const r=helpAnswer(q.trim());S.helpMsgs.push(Object.assign({q:q.trim()},r))}
function helpBody(){
  const m=S.helpMsgs||[],tk=S.ticket;
  let body;
  if(!m.length&&!tk)body=`<div class="hp-empty"><span class="hp-logo">${ic("help")}</span><h2>Como posso ajudar?</h2><p class="muted">Tiro dúvidas sobre como usar a Lya e abro chamados para o time de suporte.</p><span class="hp-safe">${ic("lock","i s")}Sem dados de pacientes aqui</span>${helpCtxCard()}
   <div class="hp-topics">${HELP_TOPICS.map(t=>`<button data-act="help-ask" data-val="${t[2]}">${ic(t[0],"i s")}<span>${t[1]}</span>${ic("chev","i s")}</button>`).join("")}<button data-act="help-ticket">${ic("plus","i s")}<span>Abrir chamado</span>${ic("chev","i s")}</button></div></div>`;
  else body=m.map((x,i)=>`<div class="ch-u"><p>${x.q}</p></div><div class="ch-a"><span class="ch-av hp">${ic("help","i s")}</span><div class="ch-at"><p>${x.a}</p>${x.doc?`<a class="hp-doc" href="https://produtos-ctc.gitbook.io/lya_health/" target="_blank" rel="noopener">${ic("doc","i s")}${x.doc}</a>`:""}
    ${x.clin?(isClinRoute()?`<button class="btn t sm" data-act="lya-to-clin" data-val="${i}">${ic("spark","i s")}Perguntar no Fale com a Lya</button>`:`<span class="small muted">Abra um atendimento ou a ficha do paciente para usar o Fale com a Lya.</span>`)
     :x.done?`<span class="small muted">${x.done}</span>`:`<div class="hp-ok"><span class="small muted">Isso resolveu?</span><button class="btn q sm" data-act="help-ok" data-val="${i}">Sim</button><button class="btn t sm" data-act="help-ticket" data-val="${i}">Abrir chamado</button></div>`}</div></div>`).join("");
  if(tk)body+=`<div class="hp-tk" role="group" aria-label="Novo chamado"><b>Novo chamado</b>
   <div class="field"><label for="tk-t">Título</label><input id="tk-t" class="input" value="${tk.t}"></div>
   <div class="field"><label for="tk-c">Categoria</label><select id="tk-c" class="input">${["Dúvida","Erro","Sugestão","Acesso","Cobrança"].map(c=>`<option ${tk.c===c?"selected":""}>${c}</option>`).join("")}</select></div>
   <div class="field"><label for="tk-d">Descrição</label><textarea id="tk-d" class="input" rows="3">${tk.d}</textarea></div>
   <p class="small muted" style="margin:0">Vai junto: tela ${TITLES[S.route]||S.route} · versão 3.8 · navegador. ${ic("lock","i s")} Não inclua nome, CPF ou dados clínicos.</p>
   <div style="display:flex;gap:8px"><button class="btn p sm" data-act="help-send-tk">Enviar chamado</button><button class="btn q sm" data-act="help-tk-x">Cancelar</button></div></div>`;
  return `<div class="ch-body" id="hp-body">${body}</div>${m.length&&!tk?`<div class="ch-quick">${HELP_TOPICS.map(t=>`<button data-act="help-ask" data-val="${t[2]}">${ic(t[0],"i s")}${t[1]}</button>`).join("")}</div>`:""}
   <div class="hp-comp"><input id="help-in" class="input" placeholder="Escreva sua dúvida…" aria-label="Sua dúvida"><button class="ch-send" data-act="help-send" aria-label="Enviar">${ic("up","i s")}</button></div><p class="ch-foot">Ajuda da Lya · respostas da documentação oficial</p>`;
}

   O valor continua no select original e dispara "change", então nenhuma tela precisa mudar. */
(function(){
  let pop=null,cur=null;
  const close=(focus)=>{if(pop){pop.remove();pop=null}if(cur){cur.classList.remove("sel-open");if(focus)cur.focus()}cur=null};
  const clr=sel=>{const k=[...sel.options].findIndex(o=>o.value==="");if(k<0)return;sel.selectedIndex=k;sel.dispatchEvent(new Event("change",{bubbles:true}));close(false)};
  const pick=(sel,i)=>{if(sel.selectedIndex!==i){sel.selectedIndex=i;sel.dispatchEvent(new Event("input",{bubbles:true}));sel.dispatchEvent(new Event("change",{bubbles:true}))}close(false)};
  function open(sel){
    close(false);if(sel.disabled||sel.multiple)return;cur=sel;sel.classList.add("sel-open");
    const opts=[...sel.options],many=opts.length>8||sel.dataset.search!=null,free=sel.dataset.free!=null,r=sel.getBoundingClientRect();
    pop=document.createElement("div");pop.className="selpop";pop.setAttribute("role","dialog");pop.setAttribute("aria-label",sel.getAttribute("aria-label")||"Escolher opção");
    pop.innerHTML=(many?`<label class="ag-s">${ic("search","i s")}<input class="sp-q" autocomplete="off" placeholder="${sel.dataset.search||"Digite para buscar"}" aria-label="Buscar opção"></label>`:"")+`<div class="ag-l" role="listbox">${sel.dataset.clear!=null&&sel.value?`<button type="button" class="ag-o sp-clr">${ic("x","i s")}Limpar campo</button>`:""}${opts.map((o,i)=>many&&o.value===""?"":`<button type="button" role="option" class="ag-o ${i===sel.selectedIndex?"on":""}" aria-selected="${i===sel.selectedIndex}" data-i="${i}" ${o.disabled?"disabled":""}>${o.textContent}${i===sel.selectedIndex?ic("check","i s"):""}</button>`).join("")}${free?`<button type="button" class="ag-o sp-add" hidden></button>`:""}</div>`;
    document.body.appendChild(pop);
    const w=Math.max(r.width,200),h=pop.offsetHeight,below=innerHeight-r.bottom-8;
    pop.style.width=w+"px";pop.style.left=Math.min(r.left,innerWidth-w-8)+"px";
    pop.style.top=(below<h&&r.top>h?r.top-h-6:r.bottom+6)+"px";
    const on=pop.querySelector(".ag-o.on")||pop.querySelector(".ag-o");
    const q=pop.querySelector(".sp-q");
    if(q){q.focus();q.addEventListener("input",()=>{const t=q.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");pop.querySelectorAll(".ag-o:not(.sp-add)").forEach(b=>b.hidden=!!t&&!b.textContent.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").includes(t));const ad=pop.querySelector(".sp-add");if(ad){const v=q.value.trim();ad.hidden=!v||[...pop.querySelectorAll(".ag-o:not(.sp-add):not([hidden])")].length>0;ad.innerHTML=`${ic("plus","i s")}Usar “${v.replace(/</g,"&lt;")}”`}})}
    else if(on)on.focus();
    if(on)on.scrollIntoView({block:"nearest"});
    const addFree=()=>{const v=q.value.trim();if(!v)return;sel.add(new Option(v,v));pick(sel,sel.options.length-1)};
    pop.addEventListener("click",e=>{const b=e.target.closest(".ag-o");if(!b)return;if(b.classList.contains("sp-add"))addFree();else if(b.classList.contains("sp-clr"))clr(sel);else pick(sel,+b.dataset.i)});
    pop.addEventListener("keydown",e=>{const all=[...pop.querySelectorAll(".ag-o:not([hidden]):not([disabled])")],i=all.indexOf(document.activeElement);
      if(e.key==="Escape"){e.preventDefault();close(true)}
      else if(e.key==="ArrowDown"){e.preventDefault();(all[i+1]||all[0])?.focus()}
      else if(e.key==="ArrowUp"){e.preventDefault();if(i<=0&&q)q.focus();else (all[i-1]||all[all.length-1])?.focus()}
      else if(e.key==="Enter"&&document.activeElement===q){e.preventDefault();const f=all.filter(b=>!b.classList.contains("sp-add"));if(f[0])pick(sel,+f[0].dataset.i);else if(free)addFree()}
      else if(e.key==="Tab")close(false)});
  }
  document.addEventListener("mousedown",e=>{const sel=e.target.closest("select");if(sel&&!sel.multiple&&!sel.dataset.native){e.preventDefault();if(cur===sel){close(true);return}sel.focus();open(sel);return}if(pop&&!e.target.closest(".selpop"))close(false)},true);
  document.addEventListener("keydown",e=>{const sel=e.target.closest&&e.target.closest("select");if(!sel||sel.multiple||sel.dataset.native)return;if((e.key==="Delete"||e.key==="Backspace")&&sel.dataset.clear!=null&&sel.value){e.preventDefault();clr(sel);return}if(e.key===" "||e.key==="Enter"||(e.key==="ArrowDown"&&e.altKey)||e.key==="F4"){e.preventDefault();open(sel)}},true);
  addEventListener("resize",()=>close(false));
  document.addEventListener("scroll",e=>{if(pop&&!(e.target.closest&&e.target.closest(".selpop")))close(false)},true);
})();
</script>
