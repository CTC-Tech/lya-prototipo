const GERAL_RX=/^(qual|quais|o que|como)\b.*\b(dose|posologia|diretriz|protocolo de|crit[eé]rio|defini[cç][aã]o|tratamento de|indica[cç][aã]o)\b|amoxicilina|dose de|o que [eé]/i;
const PAC_RX=/\b(paciente|ele|ela|dele|dela|paulo|fernando|este atendimento|até agora|resum|faltam|intera|escore|risco|alergi|atestado|documento|orienta)/i;
function chatScopeOf(q){const {inC}=chatCtx();if(!inC)return "geral";if(S.chatScope==="geral")return "geral";return GERAL_RX.test(q)&&!PAC_RX.test(q)?"geral":"pac"}
function chatAsk(q){if(!q||!q.trim())return;S.cite=null;if(useBlocked("perg")){toast("Limite de perguntas do mês atingido");return}useAdd("perg");if(/chamado|suporte|senha|login|meu plano|pagamento|fatura|como (eu )?(gero|fa[çc]o|crio|configuro|instalo|uso a lya)|n[aã]o (est[aá] )?funciona|erro na (lya|plataforma)/i.test(q)){S.chatMsgs.push({q:q.trim(),a:"Essa é uma dúvida sobre a plataforma, então quem responde é a Ajuda da Lya. Lá eu não levo os dados do paciente.",src:[],help:q.trim()});return}const {inC}=chatCtx();const sc=chatScopeOf(q);const [a,src,ttl]=answerFor(q,inC&&sc==="pac");S.chatMsgs.push({q:q.trim(),a,src,ttl,sc:inC?sc:null,auto:inC&&S.chatScope!=="geral"&&sc==="geral"});S.chatPlus=false;S.chatFontes=false;S.chatDocs=null}
function chatThread(){
  const {inC}=chatCtx();
  if(!S.chatMsgs.length){
    const sug=inC&&S.c.phase!=="live"?CHAT_QUICK_REV:inC?[["doc","Resumir até agora","Resuma até agora"],["list","Perguntas que faltam","Que perguntas ainda faltam?"],["alert","Interações e alergias","Checar interações"],["gauge","Escore de gravidade","Calcular escore de risco"]]:[["flask","Dose de medicamento","Dose de amoxicilina para sinusite em adulto?"],["alert","Interações entre medicamentos","Interações entre losartana e ibuprofeno"],["file","Gerar um atestado","Gerar atestado de 3 dias"],["book","Buscar protocolo da instituição","Protocolo de sepse da instituição"]];
    return `<div class="ch-empty"><span class="ch-logo">${ic("spark")}</span><h2>Olá, Dra. Helena</h2>${inC?`<p class="muted ch-intro">Posso resumir o atendimento, checar interações e alergias e buscar nos protocolos da instituição, sempre mostrando a fonte.</p>`:`<p class="muted">Como posso ajudar hoje?</p>`}
     <div class="ch-sug">${sug.map(s=>`<button data-act="c-ask" data-val="${s[2]}">${ic(s[0]==="book"?"doc":s[0],"i s")}<span>${s[1]}</span></button>`).join("")}</div></div>`;
  }
  return S.chatMsgs.map((m,i)=>`<div class="ch-u"><p>${m.q}</p></div>
   <div class="ch-a"><span class="ch-av">${ic("spark","i s")}</span><div class="ch-at">${m.sc?`<span class="ch-scope ${m.sc}">${m.sc==="pac"?`${ic("user","i s")}Sobre ${PT.nome} · fica no registro do atendimento`:`${ic("search","i s")}Pergunta geral · sem dados do paciente${m.auto?" (detectada pela Lya)":""}`}</span>`:""}${m.src.length&&CITE[m.src[0]]?`<div class="ch-found">${ic("search","i s")}${m.ttl?`<b>${m.ttl}</b> · `:""}${m.src.length} ${m.src.length>1?"fontes consultadas":"fonte consultada"}</div>`:""}${/^<(p|ul)/.test(m.a)?citeChips(i,m.a):`<p>${m.a}</p>`}${m.help?`<button class="btn t sm" style="justify-self:start" data-act="lya-to-help" data-val="${i}">${ic("help","i s")}Ir para a Ajuda</button>`:""}${m.src.length&&CITE[m.src[0]]?citeRefs(i,m.src):m.src.length?`<div class="ch-src">${m.src.map((x,j)=>`<span class="cite">${j+1} · ${x}</span>`).join("")}</div>`:""}
    <div class="ch-tools"><button class="iconbtn sm" data-act="chat-act" data-val="Resposta copiada" aria-label="Copiar" title="Copiar">${ic("copy","i s")}</button><button class="iconbtn sm" data-act="chat-act" data-val="Gerando outra versão" aria-label="Refazer" title="Refazer">${ic("hist","i s")}</button><button class="iconbtn sm" data-act="chat-act" data-val="Obrigado pela avaliação" aria-label="Resposta útil" title="Útil">${ic("check","i s")}</button><button class="iconbtn sm" data-act="chat-act" data-val="Conte o que faltou" aria-label="Resposta não útil" title="Não útil">${ic("x","i s")}</button>
     <span class="sp"></span>${inC&&m.sc!=="geral"&&can("at_criar")?`<button class="btn q sm" data-act="chat-act" data-val="${S.c&&S.c.phase==="sent"?"Inserido como adendo ao relatório integrado":"Inserido no relatório como pendência de revisão"}">${ic("doc","i s")}${S.c&&S.c.phase==="sent"?"Inserir como adendo":"Inserir no relatório"}</button>`:""}${can("at_criar")?`<div class="dd"><button class="btn q sm" data-act="chat-docs" data-val="${i}">${ic("file","i s")}Gerar documento</button>${S.chatDocs===String(i)?`<div class="dd-menu up" role="menu">${CHAT_DOCS.map(d=>`<button role="menuitem" data-act="chat-act" data-val="${d}: rascunho criado na aba do documento">${d}</button>`).join("")}</div>`:""}</div>`:""}</div>
   </div></div>`).join("");
}
function chatComposer(o){
  o=o||{};const id=o.id||"chat-in";
  const {inC}=chatCtx();
  const fontes=[["pront",isB2C()?"Atendimentos na Lya":"Prontuário"],["proto","Protocolos da instituição"],["lit","Literatura"]];
  const on=fontes.filter(f=>S.chatSrc[f[0]]).length;
  const menu=S.chatMenuFor===id;
  const scope=inC&&!o.big?`<div class="ch-scopes" role="group" aria-label="Escopo da pergunta"><button class="${S.chatScope!=="geral"?"on":""}" data-act="chat-scope" data-val="pac">${ic("user","i s")}Sobre ${PT.nome.split(" ")[0]}</button><button class="${S.chatScope==="geral"?"on":""}" data-act="chat-scope" data-val="geral">${ic("search","i s")}Pergunta geral</button></div>`:"";
  if(useBlocked("perg"))return scope+useWall("perg");
  return scope+`<div class="ch-comp ${o.big?"big":""}">
   <textarea id="${id}" rows="${o.big?2:1}" aria-label="Pergunta para a Lya" placeholder="${o.ph||(inC?"Pergunte o que quiser sobre este paciente":"Fale com a Lya")}"></textarea>
   <div class="ch-row">
    <div class="dd"><button class="ch-ico bare" data-act="chat-plus" data-val="${id}" aria-label="Mais opções" aria-expanded="${menu&&S.chatPlus}">${ic("plus")}</button>${menu&&S.chatPlus?`<div class="dd-menu ${o.big?"":"up"}" role="menu"><button role="menuitem" data-act="chat-act" data-val="Escolha um PDF ou imagem">${ic("clip","i s")} Anexar exame ou arquivo</button><button role="menuitem" data-act="chat-act" data-val="Prompts salvos: digite / no campo">${ic("list","i s")} Prompts salvos</button><button role="menuitem" data-act="chat-act" data-val="Escolha o paciente para dar contexto">${ic("user","i s")} Escolher paciente</button></div>`:""}</div>
    <span class="sp"></span>
    <div class="dd"><button class="ch-mode" data-act="chat-fontes" data-val="${id}" aria-expanded="${menu&&S.chatFontes}">Fontes <span class="muted">${on} de 3</span> ${ic("chev","i s chev-d")}</button>${menu&&S.chatFontes?`<div class="dd-menu ${o.big?"":"up"} right" role="menu">${fontes.map(([k,l])=>`<button role="menuitemcheckbox" aria-checked="${!!S.chatSrc[k]}" data-act="chat-src" data-val="${k}"><span class="ck ${S.chatSrc[k]?"on":""}">${S.chatSrc[k]?ic("check","i s"):""}</span>${l}</button>`).join("")}</div>`:""}</div>
    <button class="ch-ico bare" data-act="chat-act" data-val="Ditado ligado: fale a pergunta" aria-label="Ditar pergunta">${ic("mic")}</button>
    <button class="ch-send" data-act="chat-send" data-val="${id}" aria-label="Enviar">${ic("up","i s")}</button>
   </div></div>${o.big?"":`<p class="ch-foot">${useLine("perg")||"A Lya pode errar. Confira as fontes; a conduta é do médico."}</p>`}`;
}

function calcSrcGuess(l){l=l.toLowerCase();if(/weight|height|age|sex|peso|altura|idade|sexo/.test(l))return "cad";if(/creatin|sodium|potass|chlorid|bicarb|albumin|hemoglob|glucose|bun|urea|cholest|hdl|triglyc|bilirub|inr|platelet|wbc|hematocrit|calcium|ast|alt|ph|pao2|lactate|troponin/.test(l))return "dc";if(/heart rate|pulse|blood pressure|systolic|temperature|respiratory|map|gcs|glasgow|spo2|saturation/.test(l))return "fala";return "dig"}

function calcCfgList(q,sec,st){
  const f=CALC_CAT.filter(c=>(!sec||c.sec===sec)&&(!q||(c.t+" "+c.s+" "+c.f).toLowerCase().includes(q))&&(st==="todas"||(st==="on"&&calcCfg(c.id).on)||(st==="off"&&!calcCfg(c.id).on)||(st==="rv"&&c.rv)));
  if(!f.length)return '<p class="hint">Nenhuma calculadora encontrada.</p>';
  return CALC_SECS.filter(x=>f.some(c=>c.sec===x)).map(x=>{const L=f.filter(c=>c.sec===x);return `<section class="cfg-sec"><h3>${x}<span class="small muted">${L.filter(c=>calcCfg(c.id).on).length} de ${L.length} ativas</span></h3><div class="card cfg-tb">${L.map(c=>{const g=calcCfg(c.id);return `<div class="cfg-r"><button class="cfg-n" data-act="cfg-open" data-val="${c.id}"><b>${c.t}</b><small>${c.s||c.f.slice(0,70)}</small></button><span class="chip line">${c.ty}</span><span class="small muted cfg-m">${c.in.length+c.cr.length} campos</span>${c.rv?`<span class="chip warn" title="${c.rv}">Revisar</span>`:'<span></span>'}<span class="small muted cfg-m">${g.on?(g.all?"Todos os agentes":g.ass.length+" agentes"):"—"}</span>${sw(g.on,"cfg-on",`data-val="${c.id}" aria-label="Ativar ${c.t}"`)}</div>`}).join("")}</div></section>`}).join("");
}

const HELP_TOPICS=[["mic","Transcrição e atendimento","Como funciona a transcrição do atendimento?"],["apps","Prompts","O que são Prompts?"],["layers","Agentes","Como escolho ou copio um agente?"],["doc","Documentos e Prescrição","Como gero a prescrição na Memed?"],["lock","Conta e Acesso","Esqueci minha senha"],["file","Planos e Pagamentos","Como mudo meu plano?"]];
function helpAnswer(q){
  const t=q.toLowerCase();
  if(/dose|intera|diagn|conduta|exame d|cid|paciente|alergi|medica/.test(t))return {a:"Isso parece uma pergunta clínica. Quem responde é o Fale com a Lya, que trabalha com o contexto do paciente. Aqui na Ajuda eu não uso dados de pacientes.",clin:q};
  if(/transcri|grava|microfone|atendimento/.test(t))return {a:"A Lya transcreve o atendimento enquanto você conversa. Ao clicar em Iniciar atendimento, a gravação começa; dá para pausar e continuar. Ao gerar o relatório, o áudio é apagado. Se o microfone não captar, confira o dispositivo em Minhas preferências.",doc:"Guia do médico · Atendimento"};
  if(/smart ?app|prompt/.test(t))return {a:"Prompts são pequenas funções de IA que rodam no atendimento, como Alergias, Queixa principal e Check-list. Cada agente define quais Prompts aparecem. Quem tem permissão cria ou edita em Inteligência › Prompts.",doc:"Guia do gestor · Prompts"};
  if(/agente|assistente/.test(t))return {a:"O agente define como a Lya trabalha no atendimento: os Prompts, o check-list e o modelo do relatório. Escolha o agente no cartão Iniciar atendimento. Os agentes prontos da Lya podem ser copiados e ajustados em Inteligência › Agentes.",doc:"Guia do gestor · Agentes"};
  if(/memed|prescri|receita|documento|atestado/.test(t))return {a:"Depois de gerar o relatório, a aba Prescrição abre já preenchida na Memed. Documentos como atestado e orientações saem pelo botão Criar, ao lado das abas do atendimento, e só são emitidos depois da sua assinatura.",doc:"Guia do médico · Documentos"};
  if(/senha|login|acesso|entrar|2fa|duas etapas/.test(t))return {a:"Para trocar a senha, vá em Minha conta › Meu perfil › Trocar senha. Enviamos um link para o seu e-mail. Se não conseguir entrar, abra um chamado que o time de suporte libera o acesso.",doc:"Conta e acesso"};
  if(/plano|pagamento|fatura|cobran|cart[aã]o|nota fiscal/.test(t))return {a:"Plano, forma de pagamento e notas fiscais ficam em Minha conta › Faturamento. Em hospitais e clínicas, a cobrança é feita pela instituição.",doc:"Planos e pagamentos"};
  if(/chamado|suporte|erro|bug|n[aã]o funciona|travou/.test(t))return {a:"Posso abrir um chamado para o time de suporte agora. Ele já vai com o resumo desta conversa, a tela e a versão. Não inclua dados de pacientes.",ticket:true};
  return {a:"Não encontrei isso na documentação. Quer que eu abra um chamado para o time de suporte?",ticket:true};
}

/* ---------- relógio do atendimento simulado ---------- */
(function live(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  setInterval(()=>{
    if(!S.c||S.c.paused||S.c.phase!=="live"||!["atendimento","relatorio","anterior"].includes(S.route))return;
    if(S.c.t>=C_END)return;
    const before=S.c.t;S.c.t=Math.min(C_END,S.c.t+(reduce?C_END:S.c.speed));
    const t=document.getElementById("c-timer");if(t)t.textContent=mmss(S.c.t);
    const changed=[...C_LINES,...C_SECS.flatMap(s=>s[1]),...C_INS].some(x=>x[0]>before&&x[0]<=S.c.t)||C_SECS.flatMap(s=>s[1]).some(l=>S.c.t-l[0]<7&&S.c.t-l[0]>=5);
    if(changed){if(["nota","trans","apps","ctx"].includes(S.c.tab))refreshConsult(["main"]);if(S.c.pop||isB2C())refreshConsult(["head"]);const sg=document.getElementById("c-sg");if(sg)sg.innerHTML=sgBar();const cnt=document.getElementById("c-inscount");if(cnt)cnt.textContent=insVis().length}
  },1000);
})();
function logCard(){
  const c=S.c;
  const clock=t=>{const sec=9*3600+31*60+Math.floor(t);return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(x=>String(x).padStart(2,"0")).join(":")};
  return `<div class="side-card"><div class="card-h" style="margin:0 0 10px"><h3>${ic("lock","i s")} Registro de controle</h3><span class="chip line">Somente leitura</span></div>
   <ol class="clog">${c.ev.map(e=>`<li><span class="mono">${clock(e[0])}</span><span>${e[1]}</span></li>`).join("")}</ol>
   <div class="clog-m small"><div><span class="muted">Duração ouvida</span><b>${mmss(c.t)}</b></div><div><span class="muted">Pausas</span><b>${c.ev.filter(e=>e[1].startsWith("Pausa")).length}</b></div><div><span class="muted">Responsável</span><b>Dra. Helena Costa</b></div><div><span class="muted">Integridade</span><b class="mono">sha256 9f2c…a71e</b></div></div>
   <button class="btn g sm" data-go="auditoria">Ver na Auditoria</button></div>`;
}
/* Envio ao prontuário: resolve pendências → encerra (fecha dados e logs) → assina e envia → integrado ou falha com nova tentativa.
   Nada se perde numa falha: o relatório fica salvo na Lya e o envio pode ser refeito. */
const pendList=()=>{const c=S.c;return [...C_REV.filter(r=>!c.res[r[0]]).map(r=>({t:r[1],d:r[2],a:`<button class="btn t sm" data-act="c-res" data-val="${r[0]}">${r[3]}</button>`})),...protoVis().filter(p=>pState(p)==="rev").map(p=>({t:"Reconfirmar conduta: "+p.t.replace("Risco de","protocolo de"),d:"Os critérios mudaram depois que você assumiu a conduta.",a:`<button class="btn t sm" data-act="c-proto" data-val="${p.k}">Abrir</button>`}))]};
function doSend(){const c=S.c;if(!c)return;const pl=pendList();
 if(pl.length){S.drawer="pend";renderOverlay();return}
 if(!c.closed){c.sendAfter=true;S.drawer="encerrar";renderOverlay();return}
 c.send="sending";cLog(isB2C()?"Assinatura do relatório iniciada":"Assinatura e envio ao prontuário iniciados");refreshConsult(["head","main"]);
 setTimeout(()=>{if(!S.c||S.c!==c)return;if(S.intFail&&!isB2C()&&!c.failedOnce){c.failedOnce=true;c.send="fail";cLog("Falha no envio ao prontuário: tempo esgotado (sistema do hospital)");refreshConsult(["head","main","side"]);toast("Não foi possível integrar. O relatório está salvo na Lya.");return}
  c.send=null;c.phase="sent";c.intId="INT-2026-104582";cLog(isB2C()?"Relatório assinado":"Relatório integrado ao prontuário · "+c.intId);refreshConsult(["head","tabs","main","side"]);toast(isB2C()?"Relatório assinado":"Integrado ao prontuário do Hospital Aurora")},1600)}

/* ---------- menu recolhido: abrir ao passar o mouse, focar ou clicar ---------- */
(function(){
  const side=document.getElementById("side");
  const wide=()=>matchMedia("(min-width:981px)").matches;
  let tIn,tOut;
  const open=()=>{if(!S.navOpen&&wide())document.body.classList.add("nav-peek")};
  const close=()=>document.body.classList.remove("nav-peek");
  side.addEventListener("mouseenter",()=>{clearTimeout(tOut);tIn=setTimeout(open,140)});
  side.addEventListener("mouseleave",()=>{clearTimeout(tIn);tOut=setTimeout(close,260)});
  side.addEventListener("focusin",open);
  side.addEventListener("focusout",e=>{if(!side.contains(e.relatedTarget))close()});
  side.addEventListener("click",e=>{
    if(S.navOpen||!wide())return;
    const link=e.target.closest("[data-go],[data-act]");
    if(link){close();return}
    // clique em área vazia só abre; fechar fica para sair com o mouse, Esc ou escolher um item
    clearTimeout(tIn);open();
  },true);
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
})();
